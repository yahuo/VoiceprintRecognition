<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声纹识别会议系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 300;
        }

        /* Tab 样式 */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 通用样式 */
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4757;
            animation: pulse 1.5s infinite;
        }

        .status-dot.connected {
            background: #2ed573;
        }

        .status-dot.recording {
            background: #ffa502;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-success {
            background: #2ed573;
            color: white;
        }

        .result-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            min-height: 300px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .transcript-item {
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 3px solid #667eea;
        }

        .transcript-item .meta {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .transcript-item .speaker {
            color: #667eea;
            font-weight: bold;
        }

        .transcript-item .confidence {
            color: #2ed573;
        }

        .transcript-item .text {
            font-size: 16px;
            line-height: 1.6;
        }

        .empty-state {
            text-align: center;
            color: #666;
            padding: 50px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input,
        .input-group select {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }

        .input-group input::placeholder {
            color: #888;
        }

        /* 声纹列表 */
        .speaker-list {
            display: grid;
            gap: 10px;
        }

        .speaker-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 3px solid #2ed573;
        }

        .speaker-item .name {
            font-size: 16px;
            font-weight: 500;
        }

        .speaker-item .btn-delete {
            padding: 8px 16px;
            font-size: 12px;
            background: rgba(255, 71, 87, 0.3);
            color: #ff4757;
            border-radius: 15px;
        }

        .speaker-item .btn-delete:hover {
            background: #ff4757;
            color: white;
        }

        /* 文件上传 */
        .file-upload {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-upload:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .file-upload .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        /* Markdown 预览 */
        .markdown-preview {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .server-url {
            margin-bottom: 20px;
        }

        .server-url input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎙️ 声纹识别会议系统</h1>

        <div class="server-url">
            <input type="text" id="serverUrl" value="http://localhost:8000" placeholder="服务器地址">
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('live')">🔴 实时录音</button>
            <button class="tab-btn" onclick="switchTab('upload')">📤 上传会议</button>
            <button class="tab-btn" onclick="switchTab('voiceprint')">👤 声纹管理</button>
        </div>

        <!-- Tab 1: 实时录音 -->
        <div id="tab-live" class="tab-content active">
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">未连接</span>
            </div>

            <div class="controls">
                <button class="btn-primary" id="btnStart" onclick="startRecording()">开始录音</button>
                <button class="btn-danger" id="btnStop" onclick="stopRecording()" disabled>停止录音</button>
            </div>

            <div class="result-box" id="transcriptBox">
                <div class="empty-state">点击"开始录音"后，对话内容将在这里实时显示...</div>
            </div>
        </div>

        <!-- Tab 2: 上传会议 -->
        <div id="tab-upload" class="tab-content">
            <div class="file-upload" onclick="document.getElementById('meetingFile').click()">
                <div class="icon">📁</div>
                <div>点击或拖拽上传会议音频</div>
                <div style="color: #666; font-size: 12px; margin-top: 5px;">支持 WAV, MP3, M4A 等格式</div>
                <input type="file" id="meetingFile" accept="audio/*" onchange="handleMeetingUpload(this)">
            </div>

            <div id="uploadStatus" style="display: none;">
                <div class="loading">
                    <div class="spinner"></div>
                    <span>正在处理会议音频，请稍候...</span>
                </div>
            </div>

            <div id="meetingResult" style="display: none;">
                <h3 style="margin-bottom: 15px;">📝 会议记录</h3>
                <div class="result-box" id="meetingTranscript"></div>
                <div style="margin-top: 15px;">
                    <button class="btn-primary" onclick="downloadMarkdown()">下载 Markdown</button>
                </div>
            </div>
        </div>

        <!-- Tab 3: 声纹管理 -->
        <div id="tab-voiceprint" class="tab-content">
            <div class="input-group" style="align-items: stretch;">
                <input type="text" id="speakerName" placeholder="说话人姓名" style="height: 48px;">
                <div class="file-upload"
                    style="padding: 0 20px; flex: 2; display: flex; align-items: center; justify-content: center; height: 48px; margin: 0; border-radius: 8px;"
                    onclick="document.getElementById('voiceprintFile').click()">
                    <span id="voiceprintFileName">选择音频文件</span>
                    <input type="file" id="voiceprintFile" accept="audio/*" onchange="updateFileName(this)">
                </div>
                <button class="btn-success" style="height: 48px;" onclick="registerVoiceprint()">注册</button>
            </div>

            <div class="controls">
                <button class="btn-primary" onclick="loadVoiceprints()">刷新列表</button>
                <button class="btn-primary" onclick="reloadVoiceprints()">热重载声纹库</button>
            </div>

            <div class="result-box">
                <div id="speakerList" class="speaker-list">
                    <div class="empty-state">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let websocket = null;
        let audioContext = null;
        let isRecording = false;
        let meetingMarkdown = '';

        const serverUrlInput = document.getElementById('serverUrl');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const transcriptBox = document.getElementById('transcriptBox');

        // Tab 切换
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');

            // 加载声纹列表
            if (tabName === 'voiceprint') {
                loadVoiceprints();
            }
        }

        function getApiUrl() {
            return serverUrlInput.value.replace(/\/$/, '');
        }

        function getWsUrl() {
            return getApiUrl().replace('http', 'ws') + '/ws/meeting/live';
        }

        // ========== 实时录音 ==========

        function updateStatus(status, text) {
            statusDot.className = 'status-dot ' + status;
            statusText.textContent = text;
        }

        function addTranscript(data) {
            if (!data.text || data.text.trim() === '') return;

            const emptyState = transcriptBox.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const item = document.createElement('div');
            item.className = 'transcript-item';
            item.innerHTML = `
                <div class="meta">
                    <span class="time">[${data.time}]</span>
                    <span class="speaker">${data.speaker}</span>
                    <span class="confidence">(置信度: ${data.confidence})</span>
                </div>
                <div class="text">${data.text}</div>
            `;
            transcriptBox.appendChild(item);
            transcriptBox.scrollTop = transcriptBox.scrollHeight;
        }

        async function startRecording() {
            try {
                websocket = new WebSocket(getWsUrl());

                websocket.onopen = () => {
                    updateStatus('connected', '已连接，正在录音...');
                };

                websocket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    addTranscript(data);
                };

                websocket.onerror = () => updateStatus('', '连接错误');
                websocket.onclose = () => {
                    updateStatus('', '连接已断开');
                    stopRecording();
                };

                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                const source = audioContext.createMediaStreamSource(stream);
                const processor = audioContext.createScriptProcessor(4096, 1, 1);

                source.connect(processor);
                processor.connect(audioContext.destination);

                processor.onaudioprocess = (e) => {
                    if (!isRecording || websocket.readyState !== WebSocket.OPEN) return;
                    const inputData = e.inputBuffer.getChannelData(0);
                    const pcmData = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        pcmData[i] = Math.max(-32768, Math.min(32767, inputData[i] * 32768));
                    }
                    websocket.send(pcmData.buffer);
                };

                isRecording = true;
                updateStatus('recording', '录音中...');
                btnStart.disabled = true;
                btnStop.disabled = false;

            } catch (error) {
                updateStatus('', '启动失败: ' + error.message);
            }
        }

        function stopRecording() {
            isRecording = false;
            if (audioContext) { audioContext.close(); audioContext = null; }
            if (websocket && websocket.readyState === WebSocket.OPEN) websocket.close();
            websocket = null;
            updateStatus('', '已停止');
            btnStart.disabled = false;
            btnStop.disabled = true;
        }

        // ========== 上传会议 ==========

        let meetingTranscriptItems = [];

        async function handleMeetingUpload(input) {
            const file = input.files[0];
            if (!file) return;

            const uploadStatus = document.getElementById('uploadStatus');
            const meetingResult = document.getElementById('meetingResult');
            const transcriptDiv = document.getElementById('meetingTranscript');

            uploadStatus.style.display = 'block';
            meetingResult.style.display = 'block';
            transcriptDiv.innerHTML = '';
            meetingTranscriptItems = [];
            meetingMarkdown = '';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${getApiUrl()}/v1/meeting/transcribe/stream`, {
                    method: 'POST',
                    body: formData
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop(); // 保留不完整的部分

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));

                                if (data.type === 'info') {
                                    // 显示总片段数
                                    uploadStatus.innerHTML = `
                                        <div class="loading">
                                            <div class="spinner"></div>
                                            <span>正在处理，共 ${data.total_segments} 个片段...</span>
                                        </div>
                                    `;
                                } else if (data.type === 'segment') {
                                    // 显示新片段
                                    const div = document.createElement('div');
                                    div.className = 'transcript-item';
                                    div.innerHTML = `
                                        <div class="meta">
                                            <span class="time">[${data.time}]</span>
                                            <span class="speaker">${data.speaker}</span>
                                            <span class="confidence">(置信度: ${data.confidence})</span>
                                        </div>
                                        <div class="text">${data.text}</div>
                                    `;
                                    transcriptDiv.appendChild(div);
                                    transcriptDiv.scrollTop = transcriptDiv.scrollHeight;

                                    // 保存数据用于生成 Markdown
                                    meetingTranscriptItems.push(data);

                                    // 更新进度
                                    uploadStatus.innerHTML = `
                                        <div class="loading">
                                            <div class="spinner"></div>
                                            <span>已处理 ${data.index} 个片段...</span>
                                        </div>
                                    `;
                                } else if (data.type === 'done') {
                                    // 处理完成
                                    uploadStatus.style.display = 'none';
                                    generateMeetingMarkdown(file.name);
                                }
                            } catch (e) {
                                console.error('解析错误:', e);
                            }
                        }
                    }
                }

            } catch (error) {
                alert('请求失败: ' + error.message);
                uploadStatus.style.display = 'none';
            } finally {
                input.value = '';
            }
        }

        function generateMeetingMarkdown(filename) {
            const now = new Date();
            const dateStr = now.toISOString().slice(0, 16).replace('T', ' ');

            let md = `# 会议记录\n\n`;
            md += `- **日期**: ${dateStr}\n`;
            md += `- **音频文件**: ${filename}\n`;
            md += `---\n\n## 会议内容\n`;

            let currentSpeaker = null;
            for (const item of meetingTranscriptItems) {
                if (item.speaker !== currentSpeaker) {
                    md += `\n**[${item.time}] ${item.speaker}**:\n`;
                    currentSpeaker = item.speaker;
                }
                md += `> ${item.text}\n`;
            }

            meetingMarkdown = md;
        }

        function downloadMarkdown() {
            const blob = new Blob([meetingMarkdown], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `meeting_${new Date().toISOString().slice(0, 10)}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // ========== 声纹管理 ==========

        async function loadVoiceprints() {
            try {
                const response = await fetch(`${getApiUrl()}/v1/voiceprint/list`);
                const result = await response.json();

                const listDiv = document.getElementById('speakerList');

                if (result.speakers && result.speakers.length > 0) {
                    listDiv.innerHTML = result.speakers.map(name => `
                        <div class="speaker-item">
                            <span class="name">👤 ${name}</span>
                            <button class="btn-delete" onclick="deleteVoiceprint('${name}')">删除</button>
                        </div>
                    `).join('');
                } else {
                    listDiv.innerHTML = '<div class="empty-state">暂无注册声纹</div>';
                }
            } catch (error) {
                document.getElementById('speakerList').innerHTML =
                    '<div class="empty-state">无法连接服务器</div>';
            }
        }

        function updateFileName(input) {
            const span = document.getElementById('voiceprintFileName');
            span.textContent = input.files[0] ? input.files[0].name : '选择音频文件';
        }

        async function registerVoiceprint() {
            const name = document.getElementById('speakerName').value.trim();
            const fileInput = document.getElementById('voiceprintFile');
            const file = fileInput.files[0];

            if (!name) { alert('请输入说话人姓名'); return; }
            if (!file) { alert('请选择音频文件'); return; }

            const formData = new FormData();
            formData.append('name', name);
            formData.append('file', file);

            try {
                const response = await fetch(`${getApiUrl()}/v1/voiceprint/register`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.status === 'success') {
                    alert(`✅ ${result.message}`);
                    document.getElementById('speakerName').value = '';
                    fileInput.value = '';
                    document.getElementById('voiceprintFileName').textContent = '选择音频文件';
                    loadVoiceprints();
                } else {
                    alert('注册失败: ' + (result.detail || '未知错误'));
                }
            } catch (error) {
                alert('请求失败: ' + error.message);
            }
        }

        async function deleteVoiceprint(name) {
            if (!confirm(`确定要删除声纹 "${name}" 吗？`)) return;

            try {
                const response = await fetch(`${getApiUrl()}/v1/voiceprint/${encodeURIComponent(name)}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (result.status === 'success') {
                    alert(`✅ ${result.message}`);
                    loadVoiceprints();
                } else {
                    alert('删除失败: ' + (result.detail || '未知错误'));
                }
            } catch (error) {
                alert('请求失败: ' + error.message);
            }
        }

        async function reloadVoiceprints() {
            try {
                const response = await fetch(`${getApiUrl()}/v1/voiceprint/reload`, { method: 'POST' });
                const result = await response.json();

                if (result.status === 'success') {
                    alert(`✅ 声纹库已重载，共 ${result.count} 个声纹`);
                    loadVoiceprints();
                }
            } catch (error) {
                alert('请求失败: ' + error.message);
            }
        }

        // 页面加载时尝试获取声纹列表
        // loadVoiceprints();
    </script>
</body>

</html>
