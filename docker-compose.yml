services:
  voiceprint-server:
    build:
      context: .
      dockerfile: Dockerfile
    # 如果你使用已发布镜像，可改成：
    # image: registry.bsoft.com.cn/pro-ai/voiceprint-server:latest
    image: voiceprint-server:latest
    container_name: voiceprint-server
    restart: always

    ports:
      - "${HOST_PORT:-18008}:8000"

    volumes:
      - "${VOICEPRINT_DB_PATH:-./voiceprint_db}:/app/voiceprint_db"
      - "${RECORDINGS_PATH:-./recordings}:/app/recordings"

    env_file:
      - .env

    environment:
      DEVICE: "${DEVICE:-cuda:0}"
      HOST: "0.0.0.0"
      PORT: "8000"
      UPLOAD_ASR_BACKEND: "${UPLOAD_ASR_BACKEND:-paraformer}"
      PYTHONUNBUFFERED: "1"                       # 禁用输出缓冲，加速 SSE/WebSocket
      CUDA_MODULE_LOADING: "LAZY"                 # 按需加载 CUDA kernel，加速启动
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"  # 减少 CUDA 内存碎片

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_DEVICE_ID:-0}"]
              capabilities: [gpu]

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/').getcode()==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  # 精简镜像：venv 外挂，镜像 < 1GB
  # 使用前先运行: bash scripts/build_venv.sh
  # 启动: docker compose --profile slim up -d
  voiceprint-server-slim:
    profiles: ["slim"]
    build:
      context: .
      dockerfile: Dockerfile.slim
    image: voiceprint-server-slim:latest
    container_name: voiceprint-server-slim
    restart: always

    ports:
      - "${HOST_PORT:-18008}:8000"

    volumes:
      - "${VENV_PATH:-./venv_docker}:/opt/venv:ro"
      - "${VOICEPRINT_DB_PATH:-./voiceprint_db}:/app/voiceprint_db"
      - "${RECORDINGS_PATH:-./recordings}:/app/recordings"
      - "${MODELS_PATH:-./models}:/app/models:ro"

    env_file:
      - .env

    environment:
      DEVICE: "${DEVICE:-cuda:0}"
      HOST: "0.0.0.0"
      PORT: "8000"
      UPLOAD_ASR_BACKEND: "${UPLOAD_ASR_BACKEND:-paraformer}"
      PYTHONUNBUFFERED: "1"
      CUDA_MODULE_LOADING: "LAZY"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      # slim 模型路径：与 scripts/download_all_models.py 的 subdir 约定一致
      VAD_MODEL_PATH: "${VAD_MODEL_PATH:-/app/models/vad/speech_fsmn_vad_zh-cn-16k-common-pytorch}"
      ASR_MODEL_PATH: "${ASR_MODEL_PATH:-/app/models/asr/Fun-ASR-Nano-2512}"
      UPLOAD_ASR_MODEL_PATH: "${UPLOAD_ASR_MODEL_PATH:-/app/models/asr/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-pytorch}"
      PUNC_MODEL_PATH: "${PUNC_MODEL_PATH:-/app/models/punc/punc_ct-transformer_zh-cn-common-vocab272727-pytorch}"
      SPK_MODEL_PATH: "${SPK_MODEL_PATH:-/app/models/spk/speech_campplus_sv_zh-cn_16k-common}"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_DEVICE_ID:-0}"]
              capabilities: [gpu]

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/').getcode()==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
