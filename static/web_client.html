<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声纹识别会议系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 300;
        }

        /* Tab 样式 */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 通用样式 */
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4757;
            animation: pulse 1.5s infinite;
        }

        .status-dot.connected {
            background: #2ed573;
        }

        .status-dot.recording {
            background: #ffa502;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-success {
            background: #2ed573;
            color: white;
        }

        .result-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            min-height: 300px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .transcript-item {
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 3px solid #667eea;
        }

        .transcript-item .meta {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .transcript-item .speaker {
            color: #667eea;
            font-weight: bold;
        }

        .transcript-item .confidence {
            color: #2ed573;
        }

        .transcript-item .text {
            font-size: 16px;
            line-height: 1.6;
        }

        .empty-state {
            text-align: center;
            color: #666;
            padding: 50px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input,
        .input-group select {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }

        .input-group input::placeholder {
            color: #888;
        }

        /* 声纹列表 */
        .speaker-list {
            display: grid;
            gap: 10px;
        }

        .speaker-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 3px solid #2ed573;
        }

        .speaker-item .name {
            font-size: 16px;
            font-weight: 500;
        }

        .speaker-item .btn-delete {
            padding: 8px 16px;
            font-size: 12px;
            background: rgba(255, 71, 87, 0.3);
            color: #ff4757;
            border-radius: 15px;
        }

        .speaker-item .btn-delete:hover {
            background: #ff4757;
            color: white;
        }

        .participant-panel {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.06) 0%, rgba(118, 75, 162, 0.06) 100%);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 18px;
            padding: 18px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .participant-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 14px;
        }

        .participant-panel-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
            background: linear-gradient(135deg, #a5b4fc, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .participant-panel-hint {
            color: #8892b0;
            font-size: 12px;
            line-height: 1.6;
        }

        .participant-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .btn-chip {
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 999px;
            background: rgba(102, 126, 234, 0.12);
            color: #a5b4fc;
            border: 1px solid rgba(102, 126, 234, 0.25);
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .btn-chip:hover:not(:disabled) {
            background: rgba(102, 126, 234, 0.24);
            border-color: rgba(102, 126, 234, 0.5);
            color: #c7d2fe;
            transform: translateY(-1px);
        }

        .participant-multiselect {
            position: relative;
        }

        .participant-control {
            min-height: 52px;
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(10, 15, 40, 0.5);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.2);
            cursor: text;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .participant-control:hover {
            border-color: rgba(102, 126, 234, 0.35);
        }

        .participant-control.is-open {
            border-color: rgba(102, 126, 234, 0.7);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15), inset 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .participant-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .participant-tags:empty {
            margin-bottom: 0;
        }

        .participant-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px 5px 6px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.25), rgba(118, 75, 162, 0.2));
            border: 1px solid rgba(122, 143, 255, 0.3);
            color: #e0e7ff;
            font-size: 13px;
            line-height: 1;
            transition: all 0.15s ease;
        }

        .participant-tag:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.35), rgba(118, 75, 162, 0.3));
        }

        .participant-tag-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .participant-tag-remove {
            width: 18px;
            height: 18px;
            padding: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: #a5b4fc;
            font-size: 13px;
            line-height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .participant-tag-remove:hover {
            background: rgba(255, 71, 87, 0.4);
            color: #fff;
        }

        .participant-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .participant-search-input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            color: #e0e7ff;
            font-size: 14px;
            padding: 2px 0;
        }

        .participant-search-input::placeholder {
            color: #4a5578;
        }

        .participant-toggle-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 10px;
            background: rgba(102, 126, 234, 0.1);
            color: #7c8fc9;
            border: 1px solid rgba(102, 126, 234, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }

        .participant-toggle-btn:hover {
            background: rgba(102, 126, 234, 0.2);
            color: #a5b4fc;
        }

        .participant-toggle-btn svg {
            transition: transform 0.25s ease;
        }

        .participant-control.is-open .participant-toggle-btn svg {
            transform: rotate(180deg);
        }

        .participant-dropdown {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 8px);
            z-index: 20;
            border-radius: 16px;
            background: rgba(15, 20, 50, 0.97);
            border: 1px solid rgba(102, 126, 234, 0.25);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.03);
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .participant-dropdown.open {
            display: block;
            animation: dropdownIn 0.18s ease;
        }

        @keyframes dropdownIn {
            from { opacity: 0; transform: translateY(-6px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .participant-options {
            max-height: 260px;
            overflow-y: auto;
            padding: 6px;
        }

        .participant-options::-webkit-scrollbar {
            width: 4px;
        }

        .participant-options::-webkit-scrollbar-track {
            background: transparent;
        }

        .participant-options::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.3);
            border-radius: 4px;
        }

        .participant-option {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            background: transparent;
            color: #c7d2fe;
            font-size: 14px;
            text-align: left;
            transition: background 0.15s ease;
            cursor: pointer;
        }

        .participant-option:hover {
            background: rgba(102, 126, 234, 0.12);
            color: #e0e7ff;
        }

        .participant-option.selected {
            background: rgba(102, 126, 234, 0.18);
            color: #e0e7ff;
        }

        .participant-option-checkbox {
            width: 18px;
            height: 18px;
            border-radius: 6px;
            border: 1.5px solid rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.15s ease;
            background: transparent;
        }

        .participant-option.selected .participant-option-checkbox {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
        }

        .participant-option-check-icon {
            display: none;
            color: #fff;
            font-size: 11px;
            line-height: 1;
            font-weight: 700;
        }

        .participant-option.selected .participant-option-check-icon {
            display: block;
        }

        .participant-option-label {
            flex: 1;
        }

        .participant-option-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #a5b4fc;
            flex-shrink: 0;
        }

        .participant-option.selected .participant-option-avatar {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.5), rgba(118, 75, 162, 0.5));
            color: #e0e7ff;
        }

        .participant-empty {
            color: #4a5578;
            font-size: 13px;
            line-height: 1.6;
            padding: 12px 8px;
        }

        /* 文件上传 */
        .file-upload {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-upload:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .file-upload .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        /* Markdown 预览 */
        .markdown-preview {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* 会议总结样式 */
        .summary-section {
            margin-top: 20px;
        }

        .summary-box {
            background: rgba(102, 126, 234, 0.08);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 15px;
            padding: 24px;
            margin-top: 12px;
            line-height: 1.8;
            font-size: 15px;
            white-space: pre-wrap;
            max-height: 50vh;
            overflow-y: auto;
        }

        .summary-box h2, .summary-box h3 {
            color: #667eea;
            margin-top: 16px;
            margin-bottom: 8px;
        }

        .summary-box h2:first-child, .summary-box h3:first-child {
            margin-top: 0;
        }

        .summary-box ul, .summary-box ol {
            padding-left: 20px;
            margin: 6px 0;
        }

        .summary-box li {
            margin-bottom: 4px;
        }

        .summary-box strong {
            color: #a78bfa;
        }

        .btn-summary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-summary:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .summary-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 30px;
            color: #aaa;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .server-url {
            margin-bottom: 20px;
        }

        .server-url input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎙️ 声纹识别会议系统</h1>

        <div class="server-url">
            <input type="text" id="serverUrl" placeholder="服务器地址">
            <script>document.getElementById('serverUrl').value = window.location.origin;</script>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('live')">🔴 实时录音</button>
            <button class="tab-btn" onclick="switchTab('upload')">📤 上传会议</button>
            <button class="tab-btn" onclick="switchTab('voiceprint')">👤 声纹管理</button>
        </div>

        <!-- Tab 1: 实时录音 -->
        <div id="tab-live" class="tab-content active">
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">未连接</span>
            </div>

            <div class="controls">
                <button class="btn-primary" id="btnStart" onclick="startRecording()">开始录音</button>
                <button class="btn-danger" id="btnStop" onclick="stopRecording()" disabled>停止录音</button>
                <button class="btn-summary" id="btnLiveSummary" onclick="requestSummary('live')" disabled>📋 会议总结</button>
            </div>

            <div id="liveRecordingFile" style="display: none; margin-bottom: 16px;"></div>

            <div class="participant-panel">
                <div class="participant-panel-header">
                    <div>
                        <div class="participant-panel-title">本次参会人</div>
                    </div>
                    <div class="participant-actions">
                        <button type="button" class="btn-chip" onclick="setParticipantSelection('live', true)">全选</button>
                        <button type="button" class="btn-chip" onclick="setParticipantSelection('live', false)">清空</button>
                    </div>
                </div>
                <div class="participant-multiselect">
                    <div id="liveParticipantControl" class="participant-control" onclick="openParticipantDropdown('live')">
                        <div id="liveParticipantTags" class="participant-tags"></div>
                        <div class="participant-input-row">
                            <input
                                id="liveParticipantSearch"
                                class="participant-search-input"
                                type="text"
                                placeholder="搜索参会人"
                                onfocus="openParticipantDropdown('live')"
                                oninput="handleParticipantSearch('live', this.value)"
                                onclick="event.stopPropagation()">
                            <button type="button" class="participant-toggle-btn" onclick="toggleParticipantDropdown('live'); event.stopPropagation();" title="展开/收起">
                                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M2.5 5L7 9.5L11.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div id="liveParticipantDropdown" class="participant-dropdown">
                        <div id="liveParticipantOptions" class="participant-options">
                            <div class="participant-empty">正在加载已注册声纹...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="result-box" id="transcriptBox">
                <div class="empty-state">点击"开始录音"后，对话内容将在这里实时显示...</div>
            </div>

            <div id="liveSummarySection" class="summary-section" style="display: none;">
                <h3>📋 会议总结</h3>
                <div id="liveSummaryBox" class="summary-box"></div>
            </div>
        </div>

        <!-- Tab 2: 上传会议 -->
        <div id="tab-upload" class="tab-content">
            <div class="participant-panel">
                <div class="participant-panel-header">
                    <div>
                        <div class="participant-panel-title">本次参会人</div>
                    </div>
                    <div class="participant-actions">
                        <button type="button" class="btn-chip" onclick="setParticipantSelection('upload', true)">全选</button>
                        <button type="button" class="btn-chip" onclick="setParticipantSelection('upload', false)">清空</button>
                    </div>
                </div>
                <div class="participant-multiselect">
                    <div id="uploadParticipantControl" class="participant-control" onclick="openParticipantDropdown('upload')">
                        <div id="uploadParticipantTags" class="participant-tags"></div>
                        <div class="participant-input-row">
                            <input
                                id="uploadParticipantSearch"
                                class="participant-search-input"
                                type="text"
                                placeholder="搜索参会人"
                                onfocus="openParticipantDropdown('upload')"
                                oninput="handleParticipantSearch('upload', this.value)"
                                onclick="event.stopPropagation()">
                            <button type="button" class="participant-toggle-btn" onclick="toggleParticipantDropdown('upload'); event.stopPropagation();" title="展开/收起">
                                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M2.5 5L7 9.5L11.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div id="uploadParticipantDropdown" class="participant-dropdown">
                        <div id="uploadParticipantOptions" class="participant-options">
                            <div class="participant-empty">正在加载已注册声纹...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="file-upload" onclick="document.getElementById('meetingFile').click()">
                <div class="icon">📁</div>
                <div>点击或拖拽上传会议音频</div>
                <div style="color: #666; font-size: 12px; margin-top: 5px;">支持 WAV, MP3, M4A 等格式</div>
                <input type="file" id="meetingFile" accept="audio/*" onchange="handleMeetingUpload(this)">
            </div>

            <div id="uploadStatus" style="display: none;">
                <div class="loading">
                    <div class="spinner"></div>
                    <span>正在处理会议音频，请稍候...</span>
                </div>
            </div>

            <div id="meetingResult" style="display: none;">
                <h3 style="margin-bottom: 15px;">📝 会议记录</h3>
                <div class="result-box" id="meetingTranscript"></div>
                <div class="controls" style="margin-top: 15px;">
                    <button class="btn-primary" onclick="downloadMarkdown()">下载 Markdown</button>
                    <button class="btn-summary" id="btnUploadSummary" onclick="requestSummary('upload')" disabled>📋 会议总结</button>
                </div>

                <div id="uploadSummarySection" class="summary-section" style="display: none;">
                    <h3>📋 会议总结</h3>
                    <div id="uploadSummaryBox" class="summary-box"></div>
                </div>
            </div>
        </div>

        <!-- Tab 3: 声纹管理 -->
        <div id="tab-voiceprint" class="tab-content">
            <div class="input-group" style="align-items: stretch;">
                <input type="text" id="speakerName" placeholder="说话人姓名" style="height: 48px;">
                <div class="file-upload"
                    style="padding: 0 20px; flex: 2; display: flex; align-items: center; justify-content: center; height: 48px; margin: 0; border-radius: 8px;"
                    onclick="document.getElementById('voiceprintFile').click()">
                    <span id="voiceprintFileName">选择音频文件</span>
                    <input type="file" id="voiceprintFile" accept="audio/*" onchange="updateFileName(this)">
                </div>
                <button class="btn-success" style="height: 48px;" onclick="registerVoiceprint()">注册</button>
            </div>

            <div class="controls">
                <button class="btn-primary" onclick="loadVoiceprints()">刷新列表</button>
                <button class="btn-primary" onclick="reloadVoiceprints()">热重载声纹库</button>
            </div>

            <div class="result-box">
                <div id="speakerList" class="speaker-list">
                    <div class="empty-state">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let websocket = null;
        let audioContext = null;
        let audioStream = null;
        let audioSource = null;
        let audioProcessorNode = null;
        let audioSinkNode = null;
        let isRecording = false;
        let isStoppingRecording = false;
        let meetingMarkdown = '';
        let liveTranscriptItems = [];  // 收集实时录音转写数据
        let liveRecordingFileId = '';
        let registeredSpeakers = [];
        let voiceprintLoadError = '';
        let voiceprintSourceUrl = '';
        let voiceprintLoadPromise = null;
        let voiceprintLoadToken = 0;
        const participantState = {
            live: { selected: new Set(), query: '', open: false },
            upload: { selected: new Set(), query: '', open: false },
        };

        const serverUrlInput = document.getElementById('serverUrl');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const transcriptBox = document.getElementById('transcriptBox');

        // Tab 切换
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');

            // 加载声纹列表
            if (tabName === 'voiceprint') {
                loadVoiceprints();
            }
        }

        function getApiUrl() {
            return serverUrlInput.value.trim().replace(/\/$/, '');
        }

        function getWsUrl(selectedParticipants = []) {
            const url = new URL(getApiUrl().replace('http', 'ws') + '/ws/meeting/live');
            selectedParticipants.forEach(name => url.searchParams.append('allowed_speakers', name));
            return url.toString();
        }

        function getSelectedParticipants(scope) {
            return Array.from(participantState[scope].selected);
        }

        function invalidateVoiceprintCache() {
            registeredSpeakers = [];
            voiceprintLoadError = '';
            voiceprintSourceUrl = '';
            Object.keys(participantState).forEach(scope => {
                participantState[scope].selected = new Set();
                participantState[scope].open = false;
            });
            renderParticipantSelectors();
        }

        function getParticipantEmptyMessage() {
            const apiUrl = getApiUrl();
            if (!apiUrl) {
                return '请先输入服务器地址。';
            }
            if (voiceprintLoadError) {
                return '列表加载失败。';
            }
            if (voiceprintSourceUrl !== apiUrl) {
                return '正在加载...';
            }
            return '暂无注册声纹。';
        }

        function normalizeParticipantSelection(scope) {
            const validSpeakers = new Set(registeredSpeakers);
            const state = participantState[scope];
            state.selected = new Set(
                Array.from(state.selected).filter(name => validSpeakers.has(name))
            );
        }

        function closeAllParticipantDropdowns() {
            Object.keys(participantState).forEach(scope => {
                participantState[scope].open = false;
                renderParticipantSelector(scope);
            });
        }

        function openParticipantDropdown(scope) {
            Object.keys(participantState).forEach(key => {
                participantState[key].open = key === scope;
            });
            renderParticipantSelectors();
        }

        function toggleParticipantDropdown(scope) {
            const nextOpen = !participantState[scope].open;
            Object.keys(participantState).forEach(key => {
                participantState[key].open = key === scope ? nextOpen : false;
            });
            renderParticipantSelectors();
            if (nextOpen) {
                document.getElementById(`${scope}ParticipantSearch`).focus();
            }
        }

        function handleParticipantSearch(scope, value) {
            participantState[scope].query = value;
            participantState[scope].open = true;
            renderParticipantSelector(scope);
        }

        function toggleParticipantSelection(scope, name) {
            const state = participantState[scope];
            if (state.selected.has(name)) {
                state.selected.delete(name);
            } else {
                state.selected.add(name);
            }
            renderParticipantSelector(scope);
            document.getElementById(`${scope}ParticipantSearch`).focus();
        }

        function removeParticipantTag(scope, name) {
            participantState[scope].selected.delete(name);
            renderParticipantSelector(scope);
        }

        function createParticipantEmpty(text) {
            const div = document.createElement('div');
            div.className = 'participant-empty';
            div.textContent = text;
            return div;
        }

        function renderParticipantSelector(scope) {
            const state = participantState[scope];
            const control = document.getElementById(`${scope}ParticipantControl`);
            const tags = document.getElementById(`${scope}ParticipantTags`);
            const dropdown = document.getElementById(`${scope}ParticipantDropdown`);
            const options = document.getElementById(`${scope}ParticipantOptions`);
            const searchInput = document.getElementById(`${scope}ParticipantSearch`);

            if (!control || !tags || !dropdown || !options || !searchInput) {
                return;
            }

            control.classList.toggle('is-open', state.open);
            dropdown.classList.toggle('open', state.open && registeredSpeakers.length > 0);

            tags.replaceChildren();
            options.replaceChildren();
            searchInput.value = state.query;

            if (!registeredSpeakers.length) {
                tags.appendChild(createParticipantEmpty(getParticipantEmptyMessage()));
                options.appendChild(createParticipantEmpty('暂无可选参会人'));
                return;
            }

            const selectedNames = registeredSpeakers.filter(name => state.selected.has(name));
            if (selectedNames.length === 0) {
                tags.appendChild(createParticipantEmpty('未选择，将从全库匹配'));
            } else {
                selectedNames.forEach(name => {
                    const tag = document.createElement('span');
                    tag.className = 'participant-tag';

                    const avatar = document.createElement('span');
                    avatar.className = 'participant-tag-avatar';
                    avatar.textContent = name.charAt(0).toUpperCase();

                    const text = document.createElement('span');
                    text.textContent = name;

                    const removeBtn = document.createElement('button');
                    removeBtn.type = 'button';
                    removeBtn.className = 'participant-tag-remove';
                    removeBtn.innerHTML = '&times;';
                    removeBtn.onclick = (event) => {
                        event.stopPropagation();
                        removeParticipantTag(scope, name);
                    };

                    tag.appendChild(avatar);
                    tag.appendChild(text);
                    tag.appendChild(removeBtn);
                    tags.appendChild(tag);
                });
            }

            const keyword = state.query.trim().toLowerCase();
            const filteredNames = registeredSpeakers.filter(name => name.toLowerCase().includes(keyword));
            if (filteredNames.length === 0) {
                options.appendChild(createParticipantEmpty('没有匹配的参会人'));
                return;
            }

            filteredNames.forEach(name => {
                const isSelected = state.selected.has(name);
                const option = document.createElement('button');
                option.type = 'button';
                option.className = 'participant-option' + (isSelected ? ' selected' : '');
                option.onclick = (event) => {
                    event.stopPropagation();
                    toggleParticipantSelection(scope, name);
                };

                // 自定义复选框
                const checkbox = document.createElement('span');
                checkbox.className = 'participant-option-checkbox';
                const checkIcon = document.createElement('span');
                checkIcon.className = 'participant-option-check-icon';
                checkIcon.textContent = '✓';
                checkbox.appendChild(checkIcon);

                // 头像圆圈
                const avatar = document.createElement('span');
                avatar.className = 'participant-option-avatar';
                avatar.textContent = name.charAt(0).toUpperCase();

                // 姓名标签
                const label = document.createElement('span');
                label.className = 'participant-option-label';
                label.textContent = name;

                option.appendChild(checkbox);
                option.appendChild(avatar);
                option.appendChild(label);
                options.appendChild(option);
            });
        }

        function renderParticipantSelectors() {
            normalizeParticipantSelection('live');
            normalizeParticipantSelection('upload');
            renderParticipantSelector('live');
            renderParticipantSelector('upload');
        }

        function setParticipantSelection(scope, checked) {
            participantState[scope].selected = checked ? new Set(registeredSpeakers) : new Set();
            renderParticipantSelector(scope);
        }

        async function ensureVoiceprintsSynced() {
            const apiUrl = getApiUrl();
            if (!apiUrl) {
                throw new Error('请先输入服务器地址');
            }

            if (voiceprintSourceUrl === apiUrl) {
                return;
            }

            invalidateVoiceprintCache();
            try {
                await loadVoiceprints();
            } catch (error) {
                console.warn('参会人列表刷新失败，将继续使用空选择:', error);
            }
        }

        // ========== 实时录音 ==========

        const TARGET_RECORDING_SAMPLE_RATE = 16000;
        let scriptResampleRemainder = new Float32Array(0);
        let scriptResampleIndex = 0;

        function floatToPcm16(sample) {
            const clamped = Math.max(-1, Math.min(1, sample));
            return clamped < 0 ? clamped * 32768 : clamped * 32767;
        }

        function downsampleToPcm16(inputData, sourceSampleRate) {
            if (sourceSampleRate === TARGET_RECORDING_SAMPLE_RATE) {
                const pcmData = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    pcmData[i] = floatToPcm16(inputData[i]);
                }
                return pcmData;
            }

            const combined = new Float32Array(scriptResampleRemainder.length + inputData.length);
            combined.set(scriptResampleRemainder);
            combined.set(inputData, scriptResampleRemainder.length);

            const step = sourceSampleRate / TARGET_RECORDING_SAMPLE_RATE;
            const output = [];
            let sourceIndex = scriptResampleIndex;
            while (sourceIndex + 1 < combined.length) {
                const index = Math.floor(sourceIndex);
                const fraction = sourceIndex - index;
                const sample = combined[index] + (combined[index + 1] - combined[index]) * fraction;
                output.push(floatToPcm16(sample));
                sourceIndex += step;
            }

            const consumed = Math.floor(sourceIndex);
            scriptResampleIndex = sourceIndex - consumed;
            scriptResampleRemainder = combined.slice(consumed);
            return new Int16Array(output);
        }

        async function createAudioWorkletNode() {
            const workletCode = `
                class PCMWorkletProcessor extends AudioWorkletProcessor {
                    constructor() {
                        super();
                        this.targetSampleRate = 16000;
                        this.remainder = new Float32Array(0);
                        this.sourceIndex = 0;
                    }

                    floatToPcm16(sample) {
                        const clamped = Math.max(-1, Math.min(1, sample));
                        return clamped < 0 ? clamped * 32768 : clamped * 32767;
                    }

                    convertToPcm16(inputData) {
                        if (sampleRate === this.targetSampleRate) {
                            const pcmData = new Int16Array(inputData.length);
                            for (let i = 0; i < inputData.length; i++) {
                                pcmData[i] = this.floatToPcm16(inputData[i]);
                            }
                            return pcmData;
                        }

                        const combined = new Float32Array(this.remainder.length + inputData.length);
                        combined.set(this.remainder);
                        combined.set(inputData, this.remainder.length);

                        const step = sampleRate / this.targetSampleRate;
                        const output = [];
                        let currentIndex = this.sourceIndex;
                        while (currentIndex + 1 < combined.length) {
                            const index = Math.floor(currentIndex);
                            const fraction = currentIndex - index;
                            const sample = combined[index] + (combined[index + 1] - combined[index]) * fraction;
                            output.push(this.floatToPcm16(sample));
                            currentIndex += step;
                        }

                        const consumed = Math.floor(currentIndex);
                        this.sourceIndex = currentIndex - consumed;
                        this.remainder = combined.slice(consumed);
                        return new Int16Array(output);
                    }

                    process(inputs) {
                        const input = inputs[0];
                        if (!input || !input[0]) {
                            return true;
                        }

                        const channelData = input[0];
                        const pcmData = this.convertToPcm16(channelData);
                        if (pcmData.length === 0) return true;
                        this.port.postMessage(pcmData.buffer, [pcmData.buffer]);
                        return true;
                    }
                }

                registerProcessor('pcm-worklet-processor', PCMWorkletProcessor);
            `;

            const blob = new Blob([workletCode], { type: 'application/javascript' });
            const moduleUrl = URL.createObjectURL(blob);

            try {
                await audioContext.audioWorklet.addModule(moduleUrl);
            } finally {
                URL.revokeObjectURL(moduleUrl);
            }

            const processorNode = new AudioWorkletNode(audioContext, 'pcm-worklet-processor');
            processorNode.port.onmessage = (event) => {
                if (!isRecording || !websocket || websocket.readyState !== WebSocket.OPEN) return;
                websocket.send(event.data);
            };
            return processorNode;
        }

        function createScriptProcessorNode() {
            const processor = audioContext.createScriptProcessor(2048, 1, 1);
            processor.onaudioprocess = (e) => {
                if (!isRecording || !websocket || websocket.readyState !== WebSocket.OPEN) return;
                const inputData = e.inputBuffer.getChannelData(0);
                const pcmData = downsampleToPcm16(inputData, audioContext.sampleRate);
                if (pcmData.length === 0) return;
                websocket.send(pcmData.buffer);
            };
            return processor;
        }

        function cleanupAudioPipeline() {
            if (audioSource && audioProcessorNode) {
                try { audioSource.disconnect(audioProcessorNode); } catch (_) {}
            }
            if (audioProcessorNode && audioSinkNode) {
                try { audioProcessorNode.disconnect(audioSinkNode); } catch (_) {}
            }
            if (audioSinkNode) {
                try { audioSinkNode.disconnect(); } catch (_) {}
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }

            audioSource = null;
            audioProcessorNode = null;
            audioSinkNode = null;
        }

        function updateStatus(status, text) {
            statusDot.className = 'status-dot ' + status;
            statusText.textContent = text;
        }

        function addTranscript(data) {
            if (!data.text || data.text.trim() === '') return;

            const emptyState = transcriptBox.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const item = document.createElement('div');
            item.className = 'transcript-item';
            item.innerHTML = `
                <div class="meta">
                    <span class="time">[${data.time}]</span>
                    <span class="speaker">${data.speaker}</span>
                    <span class="confidence">(置信度: ${data.confidence})</span>
                </div>
                <div class="text">${data.text}</div>
            `;
            transcriptBox.appendChild(item);
            transcriptBox.scrollTop = transcriptBox.scrollHeight;

            // 同时收集到 liveTranscriptItems 用于后续总结
            liveTranscriptItems.push({
                speaker: data.speaker,
                text: data.text,
                time: data.time || '',
                confidence: data.confidence || 0
            });
        }

        function resetLiveRecordingFile() {
            liveRecordingFileId = '';
            const box = document.getElementById('liveRecordingFile');
            box.style.display = 'none';
            box.replaceChildren();
        }

        function renderLiveRecordingFile(fileId) {
            const box = document.getElementById('liveRecordingFile');
            box.replaceChildren();
            if (!fileId) {
                box.style.display = 'none';
                return;
            }

            const label = document.createElement('span');
            label.textContent = `录音文件 ID: ${fileId} `;

            const link = document.createElement('a');
            link.href = `${getApiUrl()}/v1/meeting/recordings/${encodeURIComponent(fileId)}`;
            link.download = `${fileId}.wav`;
            link.textContent = '下载录音';

            box.appendChild(label);
            box.appendChild(link);
            box.style.display = 'block';
        }

        function finishRecordingUi(statusTextValue) {
            isRecording = false;
            isStoppingRecording = false;
            cleanupAudioPipeline();
            websocket = null;
            updateStatus('', statusTextValue || '已停止');
            btnStart.disabled = false;
            btnStop.disabled = true;
            if (liveTranscriptItems.length > 0) {
                document.getElementById('btnLiveSummary').disabled = false;
            }
        }

        async function startRecording() {
            try {
                await ensureVoiceprintsSynced();
                // 重置上次的数据
                liveTranscriptItems = [];
                scriptResampleRemainder = new Float32Array(0);
                scriptResampleIndex = 0;
                resetLiveRecordingFile();
                document.getElementById('liveSummarySection').style.display = 'none';
                document.getElementById('btnLiveSummary').disabled = true;
                const selectedParticipants = getSelectedParticipants('live');

                websocket = new WebSocket(getWsUrl(selectedParticipants));

                websocket.onopen = () => {
                    updateStatus('connected', '已连接，正在录音...');
                };

                websocket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'error') {
                        updateStatus('', data.message || '连接失败');
                        return;
                    }
                    if (data.type === 'recording_saved') {
                        liveRecordingFileId = data.fileId || '';
                        renderLiveRecordingFile(liveRecordingFileId);
                        updateStatus('connected', liveRecordingFileId ? '录音已保存' : '已停止');
                        if (websocket && websocket.readyState === WebSocket.OPEN) websocket.close();
                        return;
                    }
                    addTranscript(data);
                };

                websocket.onerror = () => {
                    if (!isStoppingRecording) updateStatus('', '连接错误');
                };
                websocket.onclose = () => {
                    if (isStoppingRecording) {
                        finishRecordingUi(liveRecordingFileId ? '录音已保存' : '已停止');
                        return;
                    }
                    finishRecordingUi('连接已断开');
                };

                audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: TARGET_RECORDING_SAMPLE_RATE,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: TARGET_RECORDING_SAMPLE_RATE
                });
                await audioContext.resume();
                audioSource = audioContext.createMediaStreamSource(audioStream);
                audioSinkNode = audioContext.createGain();
                audioSinkNode.gain.value = 0;

                if (audioContext.audioWorklet) {
                    try {
                        audioProcessorNode = await createAudioWorkletNode();
                    } catch (error) {
                        console.warn('AudioWorklet 初始化失败，回退到 ScriptProcessor:', error);
                        audioProcessorNode = createScriptProcessorNode();
                    }
                } else {
                    audioProcessorNode = createScriptProcessorNode();
                }

                audioSource.connect(audioProcessorNode);
                audioProcessorNode.connect(audioSinkNode);
                audioSinkNode.connect(audioContext.destination);

                isRecording = true;
                updateStatus('recording', '录音中...');
                btnStart.disabled = true;
                btnStop.disabled = false;

            } catch (error) {
                cleanupAudioPipeline();
                updateStatus('', '启动失败: ' + error.message);
            }
        }

        async function stopRecording() {
            if (isStoppingRecording) return;
            btnStop.disabled = true;

            if (websocket && websocket.readyState === WebSocket.OPEN) {
                isStoppingRecording = true;
                updateStatus('connected', '正在保存录音...');
                // 让 worklet 通过 port 推送的最后一批 PCM 进入主线程发送队列。
                await new Promise(resolve => setTimeout(resolve, 0));
                isRecording = false;
                cleanupAudioPipeline();
                try {
                    websocket.send(JSON.stringify({ type: 'stop_recording' }));
                } catch (error) {
                    finishRecordingUi('停止失败: ' + error.message);
                }
                return;
            }

            isRecording = false;
            cleanupAudioPipeline();
            if (websocket && websocket.readyState === WebSocket.CONNECTING) {
                websocket.close();
            }
            finishRecordingUi('已停止');
        }

        // ========== 上传会议 ==========

        let meetingTranscriptItems = [];

        async function handleMeetingUpload(input) {
            const file = input.files[0];
            if (!file) return;

            const uploadStatus = document.getElementById('uploadStatus');
            const meetingResult = document.getElementById('meetingResult');
            const transcriptDiv = document.getElementById('meetingTranscript');

            uploadStatus.style.display = 'block';
            meetingResult.style.display = 'block';
            transcriptDiv.innerHTML = '';
            meetingTranscriptItems = [];
            meetingMarkdown = '';

            try {
                await ensureVoiceprintsSynced();

                const formData = new FormData();
                formData.append('file', file);
                getSelectedParticipants('upload').forEach(name => {
                    formData.append('allowed_speakers', name);
                });

                const response = await fetch(`${getApiUrl()}/v1/meeting/transcribe/stream`, {
                    method: 'POST',
                    body: formData
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop(); // 保留不完整的部分

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));

                                if (data.type === 'status') {
                                    uploadStatus.innerHTML = `
                                        <div class="loading">
                                            <div class="spinner"></div>
                                            <span>${data.message}</span>
                                        </div>
                                    `;
                                } else if (data.type === 'info') {
                                    // 显示总片段数
                                    uploadStatus.innerHTML = `
                                        <div class="loading">
                                            <div class="spinner"></div>
                                            <span>正在处理，共 ${data.total_segments} 个片段（${data.method}）...</span>
                                        </div>
                                    `;
                                } else if (data.type === 'segment') {
                                    // 显示新片段
                                    const div = document.createElement('div');
                                    div.className = 'transcript-item';
                                    div.innerHTML = `
                                        <div class="meta">
                                            <span class="time">[${data.time}]</span>
                                            <span class="speaker">${data.speaker}</span>
                                            <span class="confidence">(置信度: ${data.confidence})</span>
                                        </div>
                                        <div class="text">${data.text}</div>
                                    `;
                                    transcriptDiv.appendChild(div);
                                    transcriptDiv.scrollTop = transcriptDiv.scrollHeight;

                                    // 保存数据用于生成 Markdown
                                    meetingTranscriptItems.push(data);

                                    // 更新进度
                                    uploadStatus.innerHTML = `
                                        <div class="loading">
                                            <div class="spinner"></div>
                                            <span>已处理 ${data.index + 1} 个片段...</span>
                                        </div>
                                    `;
                                } else if (data.type === 'speaker_correction') {
                                    // ⚡️ 处理说话人修正 (Diarization)
                                    console.log("收到说话人修正:", data.updates);

                                    for (const update of data.updates) {
                                        const idx = update.index;
                                        const newSpeaker = update.speaker;

                                        // 1. 更新内部数据
                                        if (meetingTranscriptItems[idx]) {
                                            meetingTranscriptItems[idx].speaker = newSpeaker;
                                        }

                                        // 2. 更新 DOM
                                        const items = transcriptDiv.querySelectorAll('.transcript-item');
                                        if (items[idx]) {
                                            const speakerSpan = items[idx].querySelector('.speaker');
                                            if (speakerSpan) {
                                                speakerSpan.textContent = newSpeaker;
                                                speakerSpan.style.color = '#ff9f43'; // 使用不同颜色高亮
                                                // 添加动画效果
                                                speakerSpan.style.transition = 'all 0.5s';
                                                speakerSpan.style.transform = 'scale(1.1)';
                                                setTimeout(() => {
                                                    speakerSpan.style.transform = 'scale(1)';
                                                }, 500);
                                            }
                                        }
                                    }

                                } else if (data.type === 'done') {
                                    // 处理完成
                                    uploadStatus.style.display = 'none';
                                    generateMeetingMarkdown(file.name);
                                    // 启用总结按钮
                                    document.getElementById('btnUploadSummary').disabled = false;
                                }
                            } catch (e) {
                                console.error('解析错误:', e);
                            }
                        }
                    }
                }

            } catch (error) {
                alert('请求失败: ' + error.message);
                uploadStatus.style.display = 'none';
            } finally {
                input.value = '';
            }
        }

        function generateMeetingMarkdown(filename) {
            const now = new Date();
            const dateStr = now.toISOString().slice(0, 16).replace('T', ' ');

            let md = `# 会议记录\n\n`;
            md += `- **日期**: ${dateStr}\n`;
            md += `- **音频文件**: ${filename}\n`;
            md += `---\n\n## 会议内容\n`;

            let currentSpeaker = null;
            for (const item of meetingTranscriptItems) {
                if (item.speaker !== currentSpeaker) {
                    md += `\n**[${item.time}] ${item.speaker}**:\n`;
                    currentSpeaker = item.speaker;
                }
                md += `> ${item.text}\n`;
            }

            meetingMarkdown = md;
        }

        function downloadMarkdown() {
            const blob = new Blob([meetingMarkdown], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `meeting_${new Date().toISOString().slice(0, 10)}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // ========== 声纹管理 ==========

        function renderSpeakerList() {
            const listDiv = document.getElementById('speakerList');
            if (!listDiv) {
                return;
            }

            if (registeredSpeakers.length > 0) {
                listDiv.innerHTML = registeredSpeakers.map(name => `
                    <div class="speaker-item">
                        <span class="name">👤 ${name}</span>
                        <button class="btn-delete" onclick="deleteVoiceprint('${name}')">删除</button>
                    </div>
                `).join('');
            } else if (!getApiUrl()) {
                listDiv.innerHTML = '<div class="empty-state">请输入服务器地址</div>';
            } else if (voiceprintLoadError) {
                listDiv.innerHTML = '<div class="empty-state">无法连接当前服务器</div>';
            } else if (voiceprintSourceUrl !== getApiUrl()) {
                listDiv.innerHTML = '<div class="empty-state">服务器地址已变更，正在等待刷新声纹列表</div>';
            } else {
                listDiv.innerHTML = '<div class="empty-state">暂无注册声纹</div>';
            }
        }

        async function loadVoiceprints() {
            const apiUrl = getApiUrl();
            if (!apiUrl) {
                invalidateVoiceprintCache();
                renderSpeakerList();
                return [];
            }

            if (voiceprintLoadPromise && voiceprintSourceUrl === apiUrl) {
                return voiceprintLoadPromise;
            }

            const loadToken = ++voiceprintLoadToken;
            voiceprintSourceUrl = apiUrl;

            voiceprintLoadPromise = (async () => {
                try {
                    voiceprintLoadError = '';
                    const response = await fetch(`${apiUrl}/v1/voiceprint/list`);
                    const result = await response.json();
                    if (loadToken !== voiceprintLoadToken || voiceprintSourceUrl !== apiUrl) {
                        return registeredSpeakers;
                    }
                    registeredSpeakers = result.speakers || [];
                    renderParticipantSelectors();
                    renderSpeakerList();
                    return registeredSpeakers;
                } catch (error) {
                    if (loadToken === voiceprintLoadToken && voiceprintSourceUrl === apiUrl) {
                        registeredSpeakers = [];
                        voiceprintLoadError = 'load_failed';
                        renderParticipantSelectors();
                        document.getElementById('speakerList').innerHTML =
                            '<div class="empty-state">无法连接服务器</div>';
                    }
                    throw error;
                } finally {
                    if (loadToken === voiceprintLoadToken) {
                        voiceprintLoadPromise = null;
                    }
                }
            })();

            return voiceprintLoadPromise;
        }

        function updateFileName(input) {
            const span = document.getElementById('voiceprintFileName');
            span.textContent = input.files[0] ? input.files[0].name : '选择音频文件';
        }

        async function registerVoiceprint() {
            const name = document.getElementById('speakerName').value.trim();
            const fileInput = document.getElementById('voiceprintFile');
            const file = fileInput.files[0];

            if (!name) { alert('请输入说话人姓名'); return; }
            if (!file) { alert('请选择音频文件'); return; }

            const formData = new FormData();
            formData.append('name', name);
            formData.append('file', file);

            try {
                const response = await fetch(`${getApiUrl()}/v1/voiceprint/register`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.status === 'success') {
                    alert(`✅ ${result.message}`);
                    document.getElementById('speakerName').value = '';
                    fileInput.value = '';
                    document.getElementById('voiceprintFileName').textContent = '选择音频文件';
                    loadVoiceprints();
                } else {
                    alert('注册失败: ' + (result.detail || '未知错误'));
                }
            } catch (error) {
                alert('请求失败: ' + error.message);
            }
        }

        async function deleteVoiceprint(name) {
            if (!confirm(`确定要删除声纹 "${name}" 吗？`)) return;

            try {
                const response = await fetch(`${getApiUrl()}/v1/voiceprint/${encodeURIComponent(name)}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (result.status === 'success') {
                    alert(`✅ ${result.message}`);
                    loadVoiceprints();
                } else {
                    alert('删除失败: ' + (result.detail || '未知错误'));
                }
            } catch (error) {
                alert('请求失败: ' + error.message);
            }
        }

        async function reloadVoiceprints() {
            try {
                const response = await fetch(`${getApiUrl()}/v1/voiceprint/reload`, { method: 'POST' });
                const result = await response.json();

                if (result.status === 'success') {
                    alert(`✅ 声纹库已重载，共 ${result.count} 个声纹`);
                    loadVoiceprints();
                }
            } catch (error) {
                alert('请求失败: ' + error.message);
            }
        }

        // ========== 会议总结 ==========

        async function requestSummary(source) {
            const btnId = source === 'live' ? 'btnLiveSummary' : 'btnUploadSummary';
            const sectionId = source === 'live' ? 'liveSummarySection' : 'uploadSummarySection';
            const boxId = source === 'live' ? 'liveSummaryBox' : 'uploadSummaryBox';
            const items = source === 'live' ? liveTranscriptItems : meetingTranscriptItems;

            const btn = document.getElementById(btnId);
            const section = document.getElementById(sectionId);
            const box = document.getElementById(boxId);

            if (!items || items.length === 0) {
                alert('没有转写内容可以总结');
                return;
            }

            // 显示 loading
            btn.disabled = true;
            btn.textContent = '⏳ 正在生成总结...';
            section.style.display = 'block';
            box.innerHTML = '<div class="summary-loading"><div class="spinner"></div><span>正在调用 AI 生成会议总结，请稍候...</span></div>';

            try {
                const response = await fetch(`${getApiUrl()}/v1/meeting/summarize`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transcript: items })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    renderSummary(box, result.summary);
                    btn.textContent = '📋 重新生成总结';
                    btn.disabled = false;
                } else {
                    box.innerHTML = `<div style="color: #ff4757;">❌ ${result.message || '生成失败'}</div>`;
                    btn.textContent = '📋 重试总结';
                    btn.disabled = false;
                }
            } catch (error) {
                box.innerHTML = `<div style="color: #ff4757;">❌ 请求失败: ${error.message}</div>`;
                btn.textContent = '📋 重试总结';
                btn.disabled = false;
            }
        }

        function renderSummary(container, markdownText) {
            // 简易 Markdown 渲染 (无需额外依赖)
            let html = markdownText
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/^- (.+)$/gm, '<li>$1</li>')
                .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
                .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
                .replace(/\n\n/g, '<br><br>')
                .replace(/\n/g, '<br>');

            // 把连续的 <li> 包裹在 <ul> 中
            html = html.replace(/(<li>.*?<\/li>(?:<br>)?)+/gs, (match) => {
                return '<ul>' + match.replace(/<br>/g, '') + '</ul>';
            });

            container.innerHTML = html;
        }

        document.addEventListener('click', (event) => {
            if (!event.target.closest('.participant-multiselect')) {
                closeAllParticipantDropdowns();
            }
        });

        serverUrlInput.addEventListener('input', () => {
            if (voiceprintSourceUrl && voiceprintSourceUrl !== getApiUrl()) {
                invalidateVoiceprintCache();
                renderSpeakerList();
            }
        });

        async function refreshVoiceprintsForCurrentServer() {
            const apiUrl = getApiUrl();
            if (!apiUrl) {
                invalidateVoiceprintCache();
                renderSpeakerList();
                return;
            }
            if (voiceprintSourceUrl !== apiUrl) {
                invalidateVoiceprintCache();
            }
            try {
                await loadVoiceprints();
            } catch (error) {
                console.warn('刷新当前服务器声纹列表失败:', error);
            }
        }

        serverUrlInput.addEventListener('change', () => {
            refreshVoiceprintsForCurrentServer();
        });

        serverUrlInput.addEventListener('blur', () => {
            refreshVoiceprintsForCurrentServer();
        });

        // 页面加载时尝试获取声纹列表，供实时/上传页面勾选参会人
        loadVoiceprints();
    </script>
</body>

</html>
