<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声纹识别会议系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 300;
        }

        /* Tab 样式 */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 通用样式 */
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4757;
            animation: pulse 1.5s infinite;
        }

        .status-dot.connected {
            background: #2ed573;
        }

        .status-dot.recording {
            background: #ffa502;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-warning {
            background: #ffa502;
            color: white;
        }

        .btn-success {
            background: #2ed573;
            color: white;
        }

        .result-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            min-height: 300px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .transcript-item {
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 3px solid #667eea;
        }

        .transcript-item .meta {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .transcript-item .speaker {
            color: #667eea;
            font-weight: bold;
        }

        .transcript-item .confidence {
            color: #2ed573;
        }

        .transcript-item .text {
            font-size: 16px;
            line-height: 1.6;
        }

        .empty-state {
            text-align: center;
            color: #666;
            padding: 50px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input,
        .input-group select {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }

        .input-group input::placeholder {
            color: #888;
        }

        /* 声纹列表 */
        .speaker-list {
            display: grid;
            gap: 10px;
        }

        .speaker-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 3px solid #2ed573;
        }

        .speaker-item .name {
            font-size: 16px;
            font-weight: 500;
        }

        .speaker-item .speaker-meta {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .speaker-id {
            font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
            font-size: 11px;
            color: #8892b0;
            word-break: break-all;
        }

        .speaker-item .btn-delete {
            padding: 8px 16px;
            font-size: 12px;
            background: rgba(255, 71, 87, 0.3);
            color: #ff4757;
            border-radius: 15px;
        }

        .speaker-item .btn-delete:hover {
            background: #ff4757;
            color: white;
        }

        .participant-panel {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.06) 0%, rgba(118, 75, 162, 0.06) 100%);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 18px;
            padding: 18px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .participant-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 14px;
        }

        .participant-panel-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
            background: linear-gradient(135deg, #a5b4fc, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .participant-panel-hint {
            color: #8892b0;
            font-size: 12px;
            line-height: 1.6;
        }

        .participant-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .btn-chip {
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 999px;
            background: rgba(102, 126, 234, 0.12);
            color: #a5b4fc;
            border: 1px solid rgba(102, 126, 234, 0.25);
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .btn-chip:hover:not(:disabled) {
            background: rgba(102, 126, 234, 0.24);
            border-color: rgba(102, 126, 234, 0.5);
            color: #c7d2fe;
            transform: translateY(-1px);
        }

        /* 实时录音保存后的卡片 */
        .recording-card {
            background: linear-gradient(135deg, rgba(46, 213, 115, 0.08) 0%, rgba(102, 126, 234, 0.08) 100%);
            border: 1px solid rgba(102, 126, 234, 0.25);
            border-radius: 18px;
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .recording-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .recording-card-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
            background: linear-gradient(135deg, #6ee7b7, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .recording-card-id-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 12px;
            color: #cbd5f5;
        }

        .recording-card-id-label {
            color: #8892b0;
            letter-spacing: 0.4px;
        }

        .recording-card-id {
            font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 10px;
            border-radius: 8px;
            color: #e2e8f0;
            user-select: all;
            word-break: break-all;
        }

        .recording-card-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .recording-card-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 999px;
            font-weight: 500;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .recording-card-btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .recording-card-btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(102, 126, 234, 0.35);
        }

        .recording-card-btn-secondary {
            background: rgba(102, 126, 234, 0.14);
            color: #c7d2fe;
            border-color: rgba(102, 126, 234, 0.3);
        }

        .recording-card-btn-secondary:hover:not(:disabled) {
            background: rgba(102, 126, 234, 0.26);
            color: #fff;
            transform: translateY(-1px);
        }

        .recording-card-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .recording-card-copy {
            background: rgba(255, 255, 255, 0.08);
            color: #cbd5f5;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 4px 12px;
            font-size: 11px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .recording-card-copy:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
        }

        .recording-card-copy.copied {
            background: rgba(46, 213, 115, 0.25);
            color: #6ee7b7;
            border-color: rgba(46, 213, 115, 0.4);
        }

        .participant-multiselect {
            position: relative;
        }

        .participant-control {
            min-height: 52px;
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(10, 15, 40, 0.5);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.2);
            cursor: text;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .participant-control:hover {
            border-color: rgba(102, 126, 234, 0.35);
        }

        .participant-control.is-open {
            border-color: rgba(102, 126, 234, 0.7);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15), inset 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .participant-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .participant-tags:empty {
            margin-bottom: 0;
        }

        .participant-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px 5px 6px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.25), rgba(118, 75, 162, 0.2));
            border: 1px solid rgba(122, 143, 255, 0.3);
            color: #e0e7ff;
            font-size: 13px;
            line-height: 1;
            transition: all 0.15s ease;
        }

        .participant-tag:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.35), rgba(118, 75, 162, 0.3));
        }

        .participant-tag-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .participant-tag-text {
            display: inline-flex;
            align-items: baseline;
            gap: 5px;
            min-width: 0;
        }

        .participant-tag-id {
            font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
            font-size: 10px;
            color: #8892b0;
        }

        .participant-tag-remove {
            width: 18px;
            height: 18px;
            padding: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: #a5b4fc;
            font-size: 13px;
            line-height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .participant-tag-remove:hover {
            background: rgba(255, 71, 87, 0.4);
            color: #fff;
        }

        .participant-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .participant-search-input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            color: #e0e7ff;
            font-size: 14px;
            padding: 2px 0;
        }

        .participant-search-input::placeholder {
            color: #4a5578;
        }

        .participant-toggle-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 10px;
            background: rgba(102, 126, 234, 0.1);
            color: #7c8fc9;
            border: 1px solid rgba(102, 126, 234, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }

        .participant-toggle-btn:hover {
            background: rgba(102, 126, 234, 0.2);
            color: #a5b4fc;
        }

        .participant-toggle-btn svg {
            transition: transform 0.25s ease;
        }

        .participant-control.is-open .participant-toggle-btn svg {
            transform: rotate(180deg);
        }

        .participant-dropdown {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 8px);
            z-index: 20;
            border-radius: 16px;
            background: rgba(15, 20, 50, 0.97);
            border: 1px solid rgba(102, 126, 234, 0.25);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.03);
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .participant-dropdown.open {
            display: block;
            animation: dropdownIn 0.18s ease;
        }

        @keyframes dropdownIn {
            from { opacity: 0; transform: translateY(-6px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .participant-options {
            max-height: 260px;
            overflow-y: auto;
            padding: 6px;
        }

        .participant-options::-webkit-scrollbar {
            width: 4px;
        }

        .participant-options::-webkit-scrollbar-track {
            background: transparent;
        }

        .participant-options::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.3);
            border-radius: 4px;
        }

        .participant-option {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            background: transparent;
            color: #c7d2fe;
            font-size: 14px;
            text-align: left;
            transition: background 0.15s ease;
            cursor: pointer;
        }

        .participant-option:hover {
            background: rgba(102, 126, 234, 0.12);
            color: #e0e7ff;
        }

        .participant-option.selected {
            background: rgba(102, 126, 234, 0.18);
            color: #e0e7ff;
        }

        .participant-option-checkbox {
            width: 18px;
            height: 18px;
            border-radius: 6px;
            border: 1.5px solid rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.15s ease;
            background: transparent;
        }

        .participant-option.selected .participant-option-checkbox {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
        }

        .participant-option-check-icon {
            display: none;
            color: #fff;
            font-size: 11px;
            line-height: 1;
            font-weight: 700;
        }

        .participant-option.selected .participant-option-check-icon {
            display: block;
        }

        .participant-option-label {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .participant-option-id {
            font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
            font-size: 11px;
            color: #8892b0;
            word-break: break-all;
        }

        .participant-option-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #a5b4fc;
            flex-shrink: 0;
        }

        .participant-option.selected .participant-option-avatar {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.5), rgba(118, 75, 162, 0.5));
            color: #e0e7ff;
        }

        .participant-empty {
            color: #4a5578;
            font-size: 13px;
            line-height: 1.6;
            padding: 12px 8px;
        }

        /* 文件上传 */
        .file-upload {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-upload:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .file-upload .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        /* Markdown 预览 */
        .markdown-preview {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* 会议总结样式 */
        .summary-section {
            margin-top: 20px;
        }

        .summary-box {
            background: rgba(102, 126, 234, 0.08);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 15px;
            padding: 24px;
            margin-top: 12px;
            line-height: 1.8;
            font-size: 15px;
            white-space: pre-wrap;
            max-height: 50vh;
            overflow-y: auto;
        }

        .summary-box h2, .summary-box h3 {
            color: #667eea;
            margin-top: 16px;
            margin-bottom: 8px;
        }

        .summary-box h2:first-child, .summary-box h3:first-child {
            margin-top: 0;
        }

        .summary-box ul, .summary-box ol {
            padding-left: 20px;
            margin: 6px 0;
        }

        .summary-box li {
            margin-bottom: 4px;
        }

        .summary-box strong {
            color: #a78bfa;
        }

        .btn-summary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-summary:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .summary-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 30px;
            color: #aaa;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .server-url {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .server-url input#adminToken {
            flex: 0 0 300px;
        }

        .server-url input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }

        /* KWS 关键词维护 */
        #tab-keywords [hidden] {
            display: none !important;
        }

        .kws-summary {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 18px;
            margin-bottom: 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.07);
        }

        .kws-summary-main {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .kws-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            color: #8f97b8;
            background: rgba(255, 255, 255, 0.08);
        }

        .kws-pill::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        .kws-pill.ok {
            color: #2ed573;
            background: rgba(46, 213, 115, 0.12);
        }

        .kws-pill.dirty {
            color: #ffa502;
            background: rgba(255, 165, 2, 0.12);
        }

        .kws-summary-meta {
            color: #8f97b8;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        .kws-legend {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 4px 10px;
            max-width: 62ch;
            font-size: 12px;
            color: #8f97b8;
        }

        .kws-legend b {
            color: #e8eaf6;
            font-weight: 500;
            white-space: nowrap;
        }

        .kws-categories {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .kws-cat {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px 18px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.07);
        }

        .kws-new-cat {
            margin-top: 14px;
            border: 1.5px dashed rgba(165, 180, 252, 0.35);
            background: transparent;
        }

        .kws-cat-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .kws-cat-title,
        .kws-cat-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .kws-cat-name {
            width: 9em;
            padding: 2px 6px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: transparent;
        }

        .kws-cat-name:hover,
        .kws-cat-name:focus {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
            outline: none;
        }

        .kws-code {
            padding: 2px 7px;
            border-radius: 6px;
            font-family: "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 12px;
            color: #a5b4fc;
            background: rgba(102, 126, 234, 0.12);
        }

        .kws-count {
            color: #8f97b8;
            font-size: 12px;
        }

        .kws-spacer {
            flex: 1;
        }

        .kws-seg {
            display: inline-flex;
            padding: 2px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.25);
        }

        .kws-seg button {
            padding: 4px 12px;
            border-radius: 999px;
            background: transparent;
            color: #8f97b8;
            font-size: 12px;
        }

        .kws-seg button[aria-pressed="true"] {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }

        .kws-chip {
            padding: 5px 12px;
            border: 1px solid rgba(102, 126, 234, 0.25);
            border-radius: 999px;
            background: rgba(102, 126, 234, 0.12);
            color: #a5b4fc;
            font-size: 12px;
        }

        .kws-chip:hover {
            background: rgba(102, 126, 234, 0.24);
        }

        .kws-chip.danger {
            border-color: rgba(255, 71, 87, 0.25);
            background: rgba(255, 71, 87, 0.1);
            color: #ff8a95;
        }

        .kws-tagbox {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            min-height: 52px;
            padding: 10px 12px;
            border-radius: 14px;
            background: rgba(10, 15, 40, 0.5);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.2);
            cursor: text;
        }

        .kws-tagbox:focus-within {
            border-color: rgba(102, 126, 234, 0.7);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15), inset 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .kws-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 6px 5px 11px;
            border-radius: 999px;
            border: 1px solid rgba(122, 143, 255, 0.3);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.25), rgba(118, 75, 162, 0.2));
            color: #e0e7ff;
            font-size: 13px;
            line-height: 1.2;
            cursor: pointer;
        }

        .kws-tag:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.38), rgba(118, 75, 162, 0.32));
        }

        .kws-tag .kws-val {
            font-family: "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 11px;
            color: #a5b4fc;
        }

        .kws-tag.new {
            border-style: dashed;
            border-color: rgba(46, 213, 115, 0.6);
        }

        .kws-tag.new::after {
            content: "未保存";
            font-size: 10px;
            color: #2ed573;
        }

        .kws-tag.pending::after {
            content: "生成发音中";
            font-size: 10px;
            color: #8f97b8;
        }

        .kws-tag.invalid {
            border: 1px solid rgba(255, 71, 87, 0.6);
            background: rgba(255, 71, 87, 0.15);
            color: #ffc1c7;
        }

        .kws-tag.invalid::after {
            content: "需修正";
            font-size: 10px;
            color: #ff8a95;
        }

        .kws-tag.selected {
            box-shadow: 0 0 0 2px #a5b4fc;
        }

        .kws-tag.armed {
            box-shadow: 0 0 0 2px #ff4757;
        }

        .kws-tag.flash {
            animation: kws-flash 0.9s;
        }

        @keyframes kws-flash {

            0%,
            100% {
                transform: none;
            }

            20%,
            60% {
                transform: translateX(-3px);
            }

            40%,
            80% {
                transform: translateX(3px);
            }
        }

        .kws-tag .kws-x {
            width: 18px;
            height: 18px;
            padding: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: #a5b4fc;
            font-size: 13px;
            line-height: 18px;
        }

        .kws-tag .kws-x:hover {
            background: rgba(255, 71, 87, 0.45);
            color: #fff;
        }

        .kws-more {
            padding: 4px 6px;
            background: none;
            color: #a5b4fc;
            font-size: 12px;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .kws-input {
            flex: 1;
            min-width: 180px;
            padding: 4px 2px;
            border: none;
            outline: none;
            background: transparent;
            color: #e8eaf6;
            font-size: 14px;
        }

        .kws-input::placeholder {
            color: #55608a;
        }

        .kws-hint {
            min-height: 18px;
            font-size: 12px;
            color: #8f97b8;
        }

        .kws-hint.warn {
            color: #ffa502;
        }

        .kws-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 12px;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.22);
        }

        .kws-panel.kws-plain {
            padding: 0;
            border: none;
            background: transparent;
        }

        .kws-panel-title {
            grid-column: 1 / -1;
            font-size: 13px;
            font-weight: 600;
        }

        .kws-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .kws-field label,
        .kws-field small {
            color: #8f97b8;
        }

        .kws-field label {
            font-size: 12px;
        }

        .kws-field small {
            font-size: 11px;
        }

        .kws-field input,
        .kws-field select {
            padding: 8px 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 14px;
        }

        .kws-tokens {
            padding: 8px 0;
            font-family: "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 13px;
            color: #a5b4fc;
            word-break: break-all;
        }

        .kws-tokens.bad {
            font-family: inherit;
            color: #ff8a95;
        }

        .kws-panel-actions {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .kws-panel-actions small {
            flex: 1;
            color: #8f97b8;
            font-size: 12px;
        }

        .kws-savebar {
            position: sticky;
            bottom: 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            background: rgba(16, 20, 44, 0.94);
            backdrop-filter: blur(8px);
        }

        .kws-savebar-text {
            flex: 1;
            min-width: 220px;
            font-size: 13px;
            color: #8f97b8;
        }

        .kws-savebar-text b {
            color: #ffa502;
            font-weight: 600;
        }

        .kws-savebar-text.err b {
            color: #ff4757;
        }

        .kws-btn {
            padding: 10px 22px;
            font-size: 14px;
        }

        .kws-btn-ghost {
            background: rgba(255, 255, 255, 0.08);
            color: #e8eaf6;
        }

        .kws-toast {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 10px);
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: calc(100% - 32px);
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            background: #2a2f55;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            font-size: 13px;
        }

        .kws-toast button {
            padding: 0;
            background: none;
            color: #a5b4fc;
            font-size: 13px;
            font-weight: 600;
        }

        @media (prefers-reduced-motion: reduce) {
            .kws-tag.flash {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎙️ 声纹识别会议系统</h1>

        <div class="server-url">
            <input type="text" id="serverUrl" placeholder="服务器地址">
            <script>document.getElementById('serverUrl').value = window.location.origin;</script>
            <input type="password" id="adminToken" placeholder="管理令牌（未启用鉴权可留空）" autocomplete="off">
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('live')">🔴 实时录音</button>
            <button class="tab-btn" onclick="switchTab('upload')">📤 上传／会后复核</button>
            <button class="tab-btn" onclick="switchTab('voiceprint')">👤 声纹管理</button>
            <button class="tab-btn" onclick="switchTab('keywords')">关键词</button>
        </div>

        <!-- Tab 1: 实时录音 -->
        <div id="tab-live" class="tab-content active">
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">未连接</span>
            </div>

            <div class="controls">
                <button class="btn-primary" id="btnStart" onclick="startRecording()">开始录音</button>
                <button class="btn-warning" id="btnPause" onclick="togglePauseRecording()" disabled>暂停录音</button>
                <button class="btn-danger" id="btnStop" onclick="stopRecording()" disabled>停止录音</button>
                <button class="btn-summary" id="btnLiveSummary" onclick="requestSummary('live')" disabled>📋 会议总结</button>
            </div>

            <div id="liveRecordingFile" class="recording-card" style="display: none;"></div>

            <div class="participant-panel">
                <div class="participant-panel-header">
                    <div>
                        <div class="participant-panel-title">本次参会人</div>
                    </div>
                    <div class="participant-actions">
                        <button type="button" class="btn-chip" onclick="setParticipantSelection('live', true)">全选</button>
                        <button type="button" class="btn-chip" onclick="setParticipantSelection('live', false)">清空</button>
                    </div>
                </div>
                <div class="participant-multiselect">
                    <div id="liveParticipantControl" class="participant-control" onclick="openParticipantDropdown('live')">
                        <div id="liveParticipantTags" class="participant-tags"></div>
                        <div class="participant-input-row">
                            <input
                                id="liveParticipantSearch"
                                class="participant-search-input"
                                type="text"
                                placeholder="搜索参会人"
                                onfocus="openParticipantDropdown('live')"
                                oninput="handleParticipantSearch('live', this.value)"
                                onclick="event.stopPropagation()">
                            <button type="button" class="participant-toggle-btn" onclick="toggleParticipantDropdown('live'); event.stopPropagation();" title="展开/收起">
                                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M2.5 5L7 9.5L11.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div id="liveParticipantDropdown" class="participant-dropdown">
                        <div id="liveParticipantOptions" class="participant-options">
                            <div class="participant-empty">正在加载已注册声纹...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="result-box" id="transcriptBox">
                <div class="empty-state">点击"开始录音"后，对话内容将在这里实时显示...</div>
            </div>

            <div id="liveSummarySection" class="summary-section" style="display: none;">
                <h3>📋 会议总结</h3>
                <div id="liveSummaryBox" class="summary-box"></div>
            </div>
        </div>

        <!-- Tab 2: 上传会议 -->
        <div id="tab-upload" class="tab-content">
            <div class="participant-panel">
                <div class="participant-panel-header">
                    <div>
                        <div class="participant-panel-title">本次参会人</div>
                    </div>
                    <div class="participant-actions">
                        <button type="button" class="btn-chip" onclick="setParticipantSelection('upload', true)">全选</button>
                        <button type="button" class="btn-chip" onclick="setParticipantSelection('upload', false)">清空</button>
                    </div>
                </div>
                <div class="participant-multiselect">
                    <div id="uploadParticipantControl" class="participant-control" onclick="openParticipantDropdown('upload')">
                        <div id="uploadParticipantTags" class="participant-tags"></div>
                        <div class="participant-input-row">
                            <input
                                id="uploadParticipantSearch"
                                class="participant-search-input"
                                type="text"
                                placeholder="搜索参会人"
                                onfocus="openParticipantDropdown('upload')"
                                oninput="handleParticipantSearch('upload', this.value)"
                                onclick="event.stopPropagation()">
                            <button type="button" class="participant-toggle-btn" onclick="toggleParticipantDropdown('upload'); event.stopPropagation();" title="展开/收起">
                                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M2.5 5L7 9.5L11.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div id="uploadParticipantDropdown" class="participant-dropdown">
                        <div id="uploadParticipantOptions" class="participant-options">
                            <div class="participant-empty">正在加载已注册声纹...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="file-upload" onclick="document.getElementById('meetingFile').click()">
                <div class="icon">📁</div>
                <div>点击或拖拽上传会议音频</div>
                <div style="color: #666; font-size: 12px; margin-top: 5px;">支持 WAV, MP3, M4A 等格式</div>
                <input type="file" id="meetingFile" accept="audio/*" onchange="handleMeetingUpload(this)">
            </div>

            <div id="uploadStatus" style="display: none;">
                <div class="loading">
                    <div class="spinner"></div>
                    <span>正在处理会议音频，请稍候...</span>
                </div>
            </div>

            <div id="meetingResult" style="display: none;">
                <div class="result-box" id="meetingTranscript"></div>
                <div class="controls" style="margin-top: 15px;">
                    <button class="btn-primary" id="btnDownloadMeeting" onclick="downloadMarkdown()" disabled>下载 Markdown</button>
                    <button class="btn-summary" id="btnUploadSummary" onclick="requestSummary('upload')" disabled>📋 会议总结</button>
                    <button class="btn-primary" id="btnResumeMeeting" onclick="restoreMeetingJob()" style="display: none;">恢复连接</button>
                    <button class="btn-primary" id="btnCancelMeeting" onclick="cancelMeetingJob()" style="display: none;">取消转写</button>
                </div>

                <div id="uploadSummarySection" class="summary-section" style="display: none;">
                    <h3>📋 会议总结</h3>
                    <div id="uploadSummaryBox" class="summary-box"></div>
                </div>
            </div>
        </div>

        <!-- Tab 3: 声纹管理 -->
        <div id="tab-voiceprint" class="tab-content">
            <div class="input-group" style="align-items: stretch;">
                <input type="text" id="speakerName" placeholder="说话人姓名" style="height: 48px;">
                <div class="file-upload"
                    style="padding: 0 20px; flex: 2; display: flex; align-items: center; justify-content: center; height: 48px; margin: 0; border-radius: 8px;"
                    onclick="document.getElementById('voiceprintFile').click()">
                    <span id="voiceprintFileName">选择音频文件</span>
                    <input type="file" id="voiceprintFile" accept="audio/*" onchange="updateFileName(this)">
                </div>
                <button class="btn-success" style="height: 48px;" onclick="registerVoiceprint()">注册</button>
            </div>

            <div class="controls">
                <button class="btn-primary" onclick="loadVoiceprints()">刷新列表</button>
                <button class="btn-primary" onclick="reloadVoiceprints()">热重载声纹库</button>
            </div>

            <div class="result-box">
                <div id="speakerList" class="speaker-list">
                    <div class="empty-state">加载中...</div>
                </div>
            </div>
        </div>

        <!-- Tab 4: KWS 关键词 -->
        <div id="tab-keywords" class="tab-content">
            <section class="kws-summary" aria-label="关键词版本">
                <div class="kws-summary-main">
                    <span id="kwsStatePill" class="kws-pill">未加载</span>
                    <span id="kwsSummaryMeta" class="kws-summary-meta"></span>
                </div>
                <div class="kws-legend">
                    <b>上下文槽位</b><span>命中后切换会话上下文，并标到之后的转写片段上，如床号。</span>
                    <b>只推事件</b><span>命中时推一条 kws.detected，由业务端处理，如下一床、暂停记录。</span>
                </div>
            </section>

            <div id="kwsCategories" class="kws-categories">
                <div class="empty-state">加载中...</div>
            </div>

            <section id="kwsNewCategory" class="kws-cat kws-new-cat" aria-label="新建类别" hidden>
                <div class="kws-cat-head">
                    <span class="kws-cat-title">新建类别</span>
                    <span class="kws-count">类别代码会出现在事件和转写的 context 里，建好后不可改</span>
                </div>
                <form class="kws-panel kws-plain" onsubmit="event.preventDefault(); kwsAddCategory();">
                    <div class="kws-field"><label for="kwsNewName">名称</label><input id="kwsNewName" placeholder="如：检查项目" autocomplete="off"></div>
                    <div class="kws-field"><label for="kwsNewCode">类别代码</label><input id="kwsNewCode" placeholder="小写字母开头，如 exam" autocomplete="off"></div>
                    <div class="kws-field"><label for="kwsNewType">类型</label>
                        <select id="kwsNewType"><option value="event">只推事件</option><option value="slot">上下文槽位</option></select>
                    </div>
                    <div class="kws-panel-actions"><span id="kwsNewHint" class="kws-hint warn"></span><button type="submit" class="kws-chip">添加类别</button></div>
                </form>
            </section>

            <div id="kwsSaveBar" class="kws-savebar" hidden>
                <div id="kwsSaveText" class="kws-savebar-text"></div>
                <button id="kwsBtnDiscard" class="kws-btn kws-btn-ghost" type="button" onclick="discardKwsChanges()">放弃改动</button>
                <button id="kwsBtnSave" class="kws-btn btn-primary" type="button" onclick="saveKwsKeywords()">保存并生效</button>
                <div id="kwsToast" class="kws-toast" role="status" hidden>
                    <span id="kwsToastText"></span><button id="kwsToastUndo" type="button" onclick="kwsUndoLast()">撤销</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let websocket = null;
        let audioContext = null;
        let audioStream = null;
        let audioSource = null;
        let audioProcessorNode = null;
        let audioSinkNode = null;
        let isRecording = false;
        let isRecordingPaused = false;
        let pauseAckTimer = null;
        let isStoppingRecording = false;
        let meetingMarkdown = '';
        let liveTranscriptItems = [];  // 收集实时录音转写数据
        let liveRecordingFileId = '';
        let liveRecordingOnly = false;  // 服务端准入降级：本场只录音、不实时转写
        let liveSessionServerUrl = '';
        let liveSessionParticipants = [];
        let meetingRequestInProgress = false;
        let activeMeetingJob = null;
        let meetingEventCursor = 0;
        const MEETING_JOB_STORAGE_KEY = 'voiceprint.meeting.job.v1';
        let registeredSpeakers = [];
        let voiceprintLoadError = '';
        let voiceprintSourceUrl = '';
        let voiceprintLoadPromise = null;
        let voiceprintLoadToken = 0;
        const participantState = {
            live: { selected: new Set(), query: '', open: false },
            upload: { selected: new Set(), query: '', open: false },
        };

        const serverUrlInput = document.getElementById('serverUrl');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const btnStart = document.getElementById('btnStart');
        const btnPause = document.getElementById('btnPause');
        const btnStop = document.getElementById('btnStop');
        const transcriptBox = document.getElementById('transcriptBox');

        // Tab 切换
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');

            // 加载声纹列表
            if (tabName === 'voiceprint') {
                loadVoiceprints();
            }
            if (tabName === 'keywords') {
                loadKwsKeywords();
            }
        }

        function getApiUrl() {
            return serverUrlInput.value.trim().replace(/\/$/, '');
        }

        // 管理类写接口带上管理令牌；服务端未设置 ADMIN_TOKEN 时忽略该头。令牌只存本浏览器。
        const ADMIN_TOKEN_STORAGE_KEY = 'voiceprintAdminToken';
        const adminTokenInput = document.getElementById('adminToken');
        adminTokenInput.value = localStorage.getItem(ADMIN_TOKEN_STORAGE_KEY) || '';
        adminTokenInput.addEventListener('input', () => {
            localStorage.setItem(ADMIN_TOKEN_STORAGE_KEY, adminTokenInput.value.trim());
        });

        function adminHeaders(headers = {}) {
            const token = adminTokenInput.value.trim();
            return token ? { ...headers, Authorization: `Bearer ${token}` } : headers;
        }

        function adminErrorText(response, result) {
            if (response.status === 401) return `需要管理令牌：请在服务器地址旁填写正确的管理令牌（${result?.detail || '未授权'}）`;
            return result?.detail || `HTTP ${response.status}`;
        }

        function getWsUrl(selectedParticipants = []) {
            const url = new URL(getApiUrl().replace('http', 'ws') + '/ws/meeting/live');
            selectedParticipants.forEach(id => url.searchParams.append('allowed_speaker_ids', id));
            return url.toString();
        }

        function getSelectedParticipants(scope) {
            return Array.from(participantState[scope].selected);
        }

        function normalizeVoiceprintSpeaker(item) {
            if (item && typeof item === 'object') {
                const id = item.id == null ? '' : String(item.id);
                const name = String(item.name || id).trim();
                return id ? { id, name: name || id } : null;
            }
            const legacyName = item == null ? '' : String(item);
            return legacyName ? { id: legacyName, name: legacyName } : null;
        }

        function normalizeVoiceprintSpeakers(items) {
            const seen = new Set();
            const speakers = [];
            (items || []).forEach(item => {
                const speaker = normalizeVoiceprintSpeaker(item);
                if (!speaker || seen.has(speaker.id)) {
                    return;
                }
                seen.add(speaker.id);
                speakers.push(speaker);
            });
            return speakers;
        }

        function formatVoiceprintId(id) {
            const value = String(id);
            return value.length > 24 ? `${value.slice(0, 12)}...${value.slice(-8)}` : value;
        }

        function invalidateVoiceprintCache() {
            registeredSpeakers = [];
            voiceprintLoadError = '';
            voiceprintSourceUrl = '';

                participantState[scope].selected = new Set();
                participantState[scope].open = false;
            });
            renderParticipantSelectors();

            if (voiceprintSourceUrl !== apiUrl) {
                return '正在加载...';

            return '暂无注册声纹。';
        }

            });

        function toggleParticipantDropdown(scope) {
            const nextOpen = !participantState[scope].open;
            Object.keys(participantState).forEach(key => {
                participantState[key].open = key === scope ? nextOpen : false;
            });
            renderParticipantSelectors();

        function handleParticipantSearch(scope, value) {
            participantState[scope].query = value;
            participantState[scope].open = true;

        function toggleParticipantSelection(scope, id) {
            const state = participantState[scope];
            if (state.selected.has(id)) {

                state.selected.add(id);
            }
            renderParticipantSelector(scope);
            document.getElementById(`${scope}ParticipantSearch`).focus();

        function renderParticipantSelector(scope) {

            const selectedSpeakers = registeredSpeakers.filter(speaker => state.selected.has(speaker.id));
            if (selectedSpeakers.length === 0) {
                const emptyText = scope === 'live' ? '未选择，仅实时转写' : '未选择，仅转写';

                        removeParticipantTag(scope, speaker.id);
                    };

                    tag.appendChild(avatar);
                    tag.appendChild(text);
                    tag.appendChild(removeBtn);
                    tags.appendChild(tag);
                });
            }

            const keyword = state.query.trim().toLowerCase();
            const filteredSpeakers = registeredSpeakers.filter(speaker => (
                speaker.name.toLowerCase().includes(keyword)
                || speaker.id.toLowerCase().includes(keyword)
            ));
            if (filteredSpeakers.length === 0) {
                options.appendChild(createParticipantEmpty('没有匹配的参会人'));
                return;
            }

            filteredSpeakers.forEach(speaker => {
                const isSelected = state.selected.has(speaker.id);
                const option = document.createElement('button');
                option.type = 'button';
                option.className = 'participant-option' + (isSelected ? ' selected' : '');
                option.onclick = (event) => {
                    event.stopPropagation();
                    toggleParticipantSelection(scope, speaker.id);
                };

                // 自定义复选框
                const checkbox = document.createElement('span');
                checkbox.className = 'participant-option-checkbox';
                const checkIcon = document.createElement('span');
                checkIcon.className = 'participant-option-check-icon';
                checkIcon.textContent = '✓';
                checkbox.appendChild(checkIcon);

                // 头像圆圈
                const avatar = document.createElement('span');
                avatar.className = 'participant-option-avatar';
                avatar.textContent = speaker.name.charAt(0).toUpperCase();

                // 姓名和声纹 id
                const label = document.createElement('span');
                label.className = 'participant-option-label';
                const nameLine = document.createElement('span');
                nameLine.textContent = speaker.name;
                const idLine = document.createElement('span');
                idLine.className = 'participant-option-id';
                idLine.textContent = speaker.id;
                idLine.title = speaker.id;
                label.appendChild(nameLine);
                label.appendChild(idLine);

                option.appendChild(checkbox);
                option.appendChild(avatar);
                option.appendChild(label);
                options.appendChild(option);
            });
        }

        function renderParticipantSelectors() {
            normalizeParticipantSelection('live');
            normalizeParticipantSelection('upload');
            renderParticipantSelector('live');
            renderParticipantSelector('upload');
        }

        function setParticipantSelection(scope, checked) {
            participantState[scope].selected = checked ? new Set(registeredSpeakers.map(speaker => speaker.id)) : new Set();
            renderParticipantSelector(scope);
        }

        async function ensureVoiceprintsSynced() {
            const apiUrl = getApiUrl();
            if (!apiUrl) {
                throw new Error('请先输入服务器地址');
            }

            if (voiceprintSourceUrl === apiUrl) {
                return;
            }

            invalidateVoiceprintCache();
            try {
                await loadVoiceprints();
            } catch (error) {
                console.warn('参会人列表刷新失败，将继续使用空选择:', error);
            }
        }

        // ========== 实时录音 ==========

        const TARGET_RECORDING_SAMPLE_RATE = 16000;
        let scriptResampleRemainder = new Float32Array(0);
        let scriptResampleIndex = 0;

        function floatToPcm16(sample) {
            const clamped = Math.max(-1, Math.min(1, sample));
            return clamped < 0 ? clamped * 32768 : clamped * 32767;
        }

        function downsampleToPcm16(inputData, sourceSampleRate) {
            if (sourceSampleRate === TARGET_RECORDING_SAMPLE_RATE) {
                const pcmData = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    pcmData[i] = floatToPcm16(inputData[i]);
                }
                return pcmData;
            }

            const combined = new Float32Array(scriptResampleRemainder.length + inputData.length);
            combined.set(scriptResampleRemainder);
            combined.set(inputData, scriptResampleRemainder.length);

            const step = sourceSampleRate / TARGET_RECORDING_SAMPLE_RATE;
            const output = [];
            let sourceIndex = scriptResampleIndex;
            while (sourceIndex + 1 < combined.length) {
                const index = Math.floor(sourceIndex);
                const fraction = sourceIndex - index;
                const sample = combined[index] + (combined[index + 1] - combined[index]) * fraction;
                output.push(floatToPcm16(sample));
                sourceIndex += step;
            }

            const consumed = Math.floor(sourceIndex);
            scriptResampleIndex = sourceIndex - consumed;
            scriptResampleRemainder = combined.slice(consumed);
            return new Int16Array(output);
        }

        async function createAudioWorkletNode() {
            const workletCode = `
                class PCMWorkletProcessor extends AudioWorkletProcessor {
                    constructor() {
                        super();
                        this.targetSampleRate = 16000;
                        this.remainder = new Float32Array(0);
                        this.sourceIndex = 0;
                    }

                    floatToPcm16(sample) {
                        const clamped = Math.max(-1, Math.min(1, sample));
                        return clamped < 0 ? clamped * 32768 : clamped * 32767;
                    }

                    convertToPcm16(inputData) {
                        if (sampleRate === this.targetSampleRate) {
                            const pcmData = new Int16Array(inputData.length);
                            for (let i = 0; i < inputData.length; i++) {
                                pcmData[i] = this.floatToPcm16(inputData[i]);
                            }
                            return pcmData;
                        }

                        const combined = new Float32Array(this.remainder.length + inputData.length);
                        combined.set(this.remainder);
                        combined.set(inputData, this.remainder.length);

                        const step = sampleRate / this.targetSampleRate;
                        const output = [];
                        let currentIndex = this.sourceIndex;
                        while (currentIndex + 1 < combined.length) {
                            const index = Math.floor(currentIndex);
                            const fraction = currentIndex - index;
                            const sample = combined[index] + (combined[index + 1] - combined[index]) * fraction;
                            output.push(this.floatToPcm16(sample));
                            currentIndex += step;
                        }

                        const consumed = Math.floor(currentIndex);
                        this.sourceIndex = currentIndex - consumed;
                        this.remainder = combined.slice(consumed);
                        return new Int16Array(output);
                    }

                    process(inputs) {
                        const input = inputs[0];
                        if (!input || !input[0]) {
                            return true;
                        }

                        const channelData = input[0];
                        const pcmData = this.convertToPcm16(channelData);
                        if (pcmData.length === 0) return true;
                        this.port.postMessage(pcmData.buffer, [pcmData.buffer]);
                        return true;
                    }
                }

                registerProcessor('pcm-worklet-processor', PCMWorkletProcessor);
            `;

            const blob = new Blob([workletCode], { type: 'application/javascript' });
            const moduleUrl = URL.createObjectURL(blob);

            try {
                await audioContext.audioWorklet.addModule(moduleUrl);
            } finally {
                URL.revokeObjectURL(moduleUrl);
            }

            const processorNode = new AudioWorkletNode(audioContext, 'pcm-worklet-processor');
            processorNode.port.onmessage = (event) => {
                if (!isRecording || isRecordingPaused || !websocket || websocket.readyState !== WebSocket.OPEN) return;
                websocket.send(event.data);
            };
            return processorNode;
        }

        function createScriptProcessorNode() {
            const processor = audioContext.createScriptProcessor(2048, 1, 1);
            processor.onaudioprocess = (e) => {
                if (!isRecording || isRecordingPaused || !websocket || websocket.readyState !== WebSocket.OPEN) return;
                const inputData = e.inputBuffer.getChannelData(0);
                const pcmData = downsampleToPcm16(inputData, audioContext.sampleRate);
                if (pcmData.length === 0) return;
                websocket.send(pcmData.buffer);
            };
            return processor;
        }

        function cleanupAudioPipeline() {
            if (audioSource && audioProcessorNode) {
                try { audioSource.disconnect(audioProcessorNode); } catch (_) {}
            }
            if (audioProcessorNode && audioSinkNode) {
                try { audioProcessorNode.disconnect(audioSinkNode); } catch (_) {}
            }
            if (audioSinkNode) {
                try { audioSinkNode.disconnect(); } catch (_) {}
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }

            audioSource = null;
            audioProcessorNode = null;
            audioSinkNode = null;
        }

        function updateStatus(status, text) {
            statusDot.className = 'status-dot ' + status;
            statusText.textContent = text;
        }

        function liveRecordingStatusText() {
            return liveRecordingOnly ? '仅录音中（实时转写繁忙）' : '录音中...';
        }

        function handleLiveStatus(data) {
            if (data.phase !== 'recording_only') return;
            liveRecordingOnly = true;
            transcriptBox.innerHTML = '<div class="empty-state">实时转写繁忙，本次只保存录音，不显示实时文字。停止后可在录音卡片点击"MOSS 会后复核"生成文字稿。</div>';
            updateStatus(isRecording ? 'recording' : 'connected', liveRecordingStatusText());
        }

        function clearPauseAckTimer() {
            if (pauseAckTimer) {
                clearTimeout(pauseAckTimer);
                pauseAckTimer = null;
            }
        }

        function startPauseAckTimer(expectedPaused) {
            clearPauseAckTimer();
            pauseAckTimer = setTimeout(() => {
                pauseAckTimer = null;
                if (!isRecording || isStoppingRecording) return;
                btnPause.disabled = false;
                btnPause.textContent = isRecordingPaused ? '继续录音' : '暂停录音';
                updateStatus('', expectedPaused ? '暂停确认超时' : '继续确认超时');
            }, 5000);
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[ch]);
        }

        function addTranscript(data) {
            if (!data.text || data.text.trim() === '') return;

            const emptyState = transcriptBox.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const segmentId = data.segmentId == null ? '' : String(data.segmentId);
            let transcriptIndex = -1;
            let item = null;

            if (segmentId) {
                transcriptIndex = liveTranscriptItems.findIndex(entry => entry.segmentId === segmentId);
                if (transcriptIndex >= 0) {
                    const current = liveTranscriptItems[transcriptIndex];
                    const incomingRevision = Number(data.revision || 0);
                    const currentRevision = Number(current.revision || 0);
                    if ((current.isFinal && !data.isFinal) || incomingRevision <= currentRevision) {
                        return;
                    }
                    item = Array.from(transcriptBox.querySelectorAll('.transcript-item'))
                        .find(entry => entry.dataset.segmentId === segmentId) || null;
                }
            }

            if (!item) {
                item = document.createElement('div');
                item.className = 'transcript-item';
                if (segmentId) item.dataset.segmentId = segmentId;
                transcriptBox.appendChild(item);
            }
            item.innerHTML = `
                <div class="meta">
                    <span class="time">[${escapeHtml(data.time)}]</span>
                    <span class="speaker">${escapeHtml(data.speaker)}</span>
                    <span class="confidence">${data.degraded ? '(最终识别失败，保留临时结果)' : data.isFinal === false ? '(临时稿)' : '(句末稿；声纹分数: ' + escapeHtml(data.confidence) + ')'}</span>
                </div>
                <div class="text">${escapeHtml(data.text)}</div>
            `;
            transcriptBox.scrollTop = transcriptBox.scrollHeight;

            const transcriptItem = {
                speaker: data.speaker,
                text: data.text,
                time: data.time || '',
                confidence: data.confidence || 0,
                segmentId,
                revision: Number(data.revision || 0),
                isFinal: data.isFinal !== false,
                degraded: data.degraded === true,
            };
            if (transcriptIndex >= 0) {
                liveTranscriptItems[transcriptIndex] = transcriptItem;
            } else {
                liveTranscriptItems.push(transcriptItem);
            }
        }

        function resetLiveRecordingFile() {
            liveRecordingFileId = '';
            const box = document.getElementById('liveRecordingFile');
            box.style.display = 'none';
            box.replaceChildren();
        }

        function renderLiveRecordingFile(fileId) {

                box.style.display = 'none';

            }

            header.appendChild(title);

            const idRow = document.createElement('div');
            idRow.className = 'recording-card-id-row';

            const idLabel = document.createElement('span');
            idLabel.className = 'recording-card-id-label';
            idLabel.textContent = 'ID';

            const idValue = document.createElement('span');
            idValue.className = 'recording-card-id';

            const copyBtn = document.createElement('button');

            idRow.appendChild(idLabel);

            const actions = document.createElement('div');

            const recordingParticipants = [...liveSessionParticipants];
            downloadLink.href = `${recordingServerUrl}/v1/meeting/recordings/${encodeURIComponent(fileId)}`;
            downloadLink.download = `${fileId}.wav`;
            downloadLink.innerHTML = '<span>⬇</span><span>下载录音</span>';

            const transcribeBtn = document.createElement('button');
            transcribeBtn.type = 'button';
            transcribeBtn.className = 'recording-card-btn recording-card-btn-primary';
            transcribeBtn.innerHTML = '<span>🎯</span><span>MOSS 会后复核</span>';
            transcribeBtn.onclick = () => transcribeLiveRecording(fileId, recordingServerUrl, recordingParticipants);

            actions.appendChild(downloadLink);
