        }

        async function copyRecordingId(fileId, btn) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(fileId);
                } else {
                    const tmp = document.createElement('textarea');
                    tmp.value = fileId;
                    tmp.style.position = 'fixed';
                    tmp.style.opacity = '0';
                    document.body.appendChild(tmp);
                    tmp.select();
                    document.execCommand('copy');
                    document.body.removeChild(tmp);
                }
                const original = btn.textContent;
                btn.textContent = '已复制';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = original;
                    btn.classList.remove('copied');
                }, 1500);
            } catch (e) {
                alert('复制失败: ' + e.message);
            }
        }

        function finishRecordingUi(statusTextValue) {
            isRecording = false;
            isRecordingPaused = false;
            isStoppingRecording = false;
            clearPauseAckTimer();
            cleanupAudioPipeline();
            websocket = null;
            updateStatus('', statusTextValue || '已停止');
            btnStart.disabled = false;
            btnPause.disabled = true;
            btnPause.textContent = '暂停录音';
            btnStop.disabled = true;
            if (liveTranscriptItems.length > 0) {
                document.getElementById('btnLiveSummary').disabled = false;
            }
        }

        async function startRecording() {
            try {
                await ensureVoiceprintsSynced();
                // 重置上次的数据
                liveTranscriptItems = [];
                liveRecordingOnly = false;
                transcriptBox.innerHTML = '<div class="empty-state">点击"开始录音"后，对话内容将在这里实时显示...</div>';
                isRecordingPaused = false;
                scriptResampleRemainder = new Float32Array(0);
                scriptResampleIndex = 0;
                resetLiveRecordingFile();
                document.getElementById('liveSummarySection').style.display = 'none';
                document.getElementById('btnLiveSummary').disabled = true;
                const selectedParticipants = getSelectedParticipants('live');
                liveSessionServerUrl = getApiUrl();
                liveSessionParticipants = [...selectedParticipants];

                websocket = new WebSocket(getWsUrl(selectedParticipants));

                websocket.onopen = () => {
                    updateStatus('connected', '已连接，正在录音...');
                };

                websocket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'error') {
                        updateStatus('', data.message || '连接失败');
                        return;
                    }
                    if (data.type === 'recording_saved') {
                        liveRecordingFileId = data.fileId || '';
                        renderLiveRecordingFile(liveRecordingFileId);
                        const transcriptionFailed = data.transcriptionStatus === 'failed';
                        updateStatus(
                            transcriptionFailed ? '' : 'connected',
                            transcriptionFailed
                                ? '录音已保存，但最终识别失败'
                                : data.transcriptionStatus === 'recording_only'
                                    ? '录音已保存（未实时转写），可生成 MOSS 会后复核稿'
                                    : (liveRecordingFileId ? '录音已保存' : '已停止')
                        );
                        if (websocket && websocket.readyState === WebSocket.OPEN) websocket.close();
                        return;
                    }
                    if (data.type === 'recording_paused') {
                        clearPauseAckTimer();
                        isRecordingPaused = true;
                        btnPause.textContent = '继续录音';
                        btnPause.disabled = false;
                        updateStatus('connected', '已暂停');
                        return;
                    }
                    if (data.type === 'recording_resumed') {
                        clearPauseAckTimer();
                        isRecordingPaused = false;
                        btnPause.textContent = '暂停录音';
                        btnPause.disabled = false;
                        updateStatus('recording', liveRecordingStatusText());
                        return;
                    }
                    if (data.type === 'status') {
                        handleLiveStatus(data);
                        return;
                    }
                    addTranscript(data);
                };

                websocket.onerror = () => {
                    if (!isStoppingRecording) updateStatus('', '连接错误');
                };
                websocket.onclose = () => {
                    if (isStoppingRecording) {
                        finishRecordingUi(liveRecordingFileId ? '录音已保存' : '已停止');
                        return;
                    }
                    finishRecordingUi('连接已断开');
                };

                audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: TARGET_RECORDING_SAMPLE_RATE,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: TARGET_RECORDING_SAMPLE_RATE
                });
                await audioContext.resume();
                audioSource = audioContext.createMediaStreamSource(audioStream);
                audioSinkNode = audioContext.createGain();
                audioSinkNode.gain.value = 0;

                if (audioContext.audioWorklet) {
                    try {
                        audioProcessorNode = await createAudioWorkletNode();
                    } catch (error) {
                        console.warn('AudioWorklet 初始化失败，回退到 ScriptProcessor:', error);
                        audioProcessorNode = createScriptProcessorNode();
                    }
                } else {
                    audioProcessorNode = createScriptProcessorNode();
                }

                audioSource.connect(audioProcessorNode);
                audioProcessorNode.connect(audioSinkNode);
                audioSinkNode.connect(audioContext.destination);

                isRecording = true;
                isRecordingPaused = false;
                updateStatus('recording', liveRecordingStatusText());
                btnStart.disabled = true;
                btnPause.disabled = false;
                btnPause.textContent = '暂停录音';
                btnStop.disabled = false;

            } catch (error) {
                cleanupAudioPipeline();
                updateStatus('', '启动失败: ' + error.message);
            }
        }

        function togglePauseRecording() {
            if (!isRecording || isStoppingRecording || !websocket || websocket.readyState !== WebSocket.OPEN) return;

            const previousPaused = isRecordingPaused;
            try {
                if (isRecordingPaused) {
                    websocket.send(JSON.stringify({ type: 'resume_recording' }));
                    isRecordingPaused = false;
                    btnPause.textContent = '暂停录音';
                    updateStatus('connected', '正在继续录音...');
                    startPauseAckTimer(false);
                } else {
                    isRecordingPaused = true;
                    btnPause.textContent = '继续录音';
                    websocket.send(JSON.stringify({ type: 'pause_recording' }));
                    updateStatus('connected', '正在暂停...');
                    startPauseAckTimer(true);
                }
                btnPause.disabled = true;
            } catch (error) {
                isRecordingPaused = previousPaused;
                clearPauseAckTimer();
                updateStatus('', '暂停操作失败: ' + error.message);
                btnPause.textContent = isRecordingPaused ? '继续录音' : '暂停录音';
                btnPause.disabled = false;
            }
        }

        async function stopRecording() {
            if (isStoppingRecording) return;
            clearPauseAckTimer();
            btnStop.disabled = true;
            btnPause.disabled = true;

            if (websocket && websocket.readyState === WebSocket.OPEN) {
                isStoppingRecording = true;
                updateStatus('connected', '正在保存录音...');
                if (!isRecordingPaused) {
                    // 让 worklet 通过 port 推送的最后一批 PCM 进入主线程发送队列。
                    await new Promise(resolve => setTimeout(resolve, 0));
                }
                isRecording = false;
                cleanupAudioPipeline();
                try {
                    websocket.send(JSON.stringify({ type: 'stop_recording' }));
                } catch (error) {
                    finishRecordingUi('停止失败: ' + error.message);
                }
                return;
            }

            isRecording = false;
            cleanupAudioPipeline();
            if (websocket && websocket.readyState === WebSocket.CONNECTING) {
                websocket.close();
            }
            finishRecordingUi('已停止');
        }

        // ========== 上传会议 ==========

        let meetingTranscriptItems = [];

        function meetingJobBusy() {
            return meetingRequestInProgress || (activeMeetingJob && !activeMeetingJob.terminal && !activeMeetingJob.unavailable);
        }

        function rememberMeetingJob(apiUrl, sourceLabel) {
            const bytes = crypto.getRandomValues(new Uint8Array(16));
            bytes[6] = (bytes[6] & 15) | 64;
            bytes[8] = (bytes[8] & 63) | 128;
            const hex = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
            const jobId = `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
            // 仅保存最近任务引用，重新打开页面也可恢复；不持久保存转写或声纹信息。
            const reference = { jobId, apiUrl };
            localStorage.setItem(MEETING_JOB_STORAGE_KEY, JSON.stringify(reference));
            activeMeetingJob = { ...reference, sourceLabel, terminal: false };
            meetingEventCursor = 0;
            return jobId;
        }

        function showMeetingConnectionStatus(message) {
            const status = document.getElementById('uploadStatus');
            status.style.display = 'block';
            status.innerHTML = `<div class="loading"><div class="spinner"></div><span>${escapeHtml(message)}</span></div>`;
        }

        async function followMeetingJob(initialResponse = null) {
            const job = activeMeetingJob;
            let response = initialResponse;
            for (let attempt = 0; attempt < 4; attempt++) {
                try {
                    if (!response) {
                        response = await fetch(`${job.apiUrl}/v1/meeting/jobs/${encodeURIComponent(job.jobId)}/events?after=${meetingEventCursor}`);
                    }
                    await consumeMeetingSseStream(response, job.sourceLabel);
                    return;
                } catch (error) {
                    if (error.terminal || error.protocol || error.httpStatus || attempt === 3) throw error;
                    // 只重连 GET 订阅；绝不重发音频或创建第二次推理。
                    showMeetingConnectionStatus('连接中断，后台转写继续，正在恢复连接...');
                    response = null;
                    await new Promise(resolve => setTimeout(resolve, 1000 * (attempt + 1)));
                }
            }
        }

        async function restoreMeetingJob() {
            if (meetingRequestInProgress) return;
            let reference;
            try {
                reference = JSON.parse(localStorage.getItem(MEETING_JOB_STORAGE_KEY) || 'null');
                if (!reference) return;
                if (!/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(reference.jobId)
                    || !['http:', 'https:'].includes(new URL(reference.apiUrl).protocol)) {
                    throw new Error('无效的转写恢复信息');
                }
            } catch (error) {
                console.warn('读取转写恢复信息失败');
                return;
            }
            meetingRequestInProgress = true;
            activeMeetingJob = { ...reference, terminal: false };
            meetingEventCursor = 0;
            switchTab('upload');
            resetMeetingResultUi();
            showMeetingConnectionStatus('正在恢复转写任务...');
            try {
                const response = await fetch(`${reference.apiUrl}/v1/meeting/jobs/${encodeURIComponent(reference.jobId)}`);
                if (!response.ok) {
                    activeMeetingJob.unavailable = response.status === 404 || response.status === 410;
                    const data = await response.json();
                    throw new Error(data.detail || `HTTP ${response.status}`);
                }
                const state = await response.json();
                activeMeetingJob.sourceLabel = state.sourceLabel;
                document.getElementById('btnCancelMeeting').style.display = ['running', 'cancelling'].includes(state.state) ? '' : 'none';
                await followMeetingJob();
            } catch (error) {
                showMeetingFailure(error);
            } finally {
                meetingRequestInProgress = false;
            }
        }

        async function cancelMeetingJob() {
            const job = activeMeetingJob;
            if (!job || job.terminal) return;
            if (!confirm('取消当前转写？已保存的原始录音不会删除。')) return;
            const button = document.getElementById('btnCancelMeeting');
            button.disabled = true;
            try {
                const response = await fetch(`${job.apiUrl}/v1/meeting/jobs/${encodeURIComponent(job.jobId)}/cancel`, { method: 'POST' });
                if (!response.ok) throw new Error((await response.json()).detail || `HTTP ${response.status}`);
                const state = await response.json();
                if (job.terminal) return;
                if (state.state === 'cancelling') showMeetingConnectionStatus('已请求取消，正在结束当前任务...');
                if (!meetingRequestInProgress) await restoreMeetingJob();
            } catch (error) {
                alert('取消请求失败：' + error.message);
            } finally {
                button.disabled = false;
            }
        }

        function formatMeetingIdentity(data) {
            if (data.speakerId) return '声纹分数: ' + data.confidence;
            if (data.identityStatus === 'not_requested') return '未选择参会人，仅匿名分人';
            if (data.identityStatus === 'insufficient_audio') return '未确认身份：有效音频不足';
            if (data.identityStatus === 'unavailable') return '未确认身份：声纹验证失败';
            const reason = data.identityStatus === 'outside_winner' ? '候选外声纹更强'
                : data.identityStatus === 'conflicting_windows' ? '窗口身份冲突' : '未通过声纹验证';
            const score = typeof data.voiceprintScore === 'number' && Number.isFinite(data.voiceprintScore)
                ? '；最高匹配分数: ' + data.voiceprintScore.toFixed(4) : '';
            return '未确认身份：' + reason + score;
        }

        async function consumeMeetingSseStream(response, sourceLabel) {
            const uploadStatus = document.getElementById('uploadStatus');
            const transcriptDiv = document.getElementById('meetingTranscript');

            if (!response.ok || !response.body) {
                let detail = '';
                try {
                    const errData = await response.json();
                    detail = errData.detail || '';
                } catch (_) { /* ignore */ }
                const error = new Error(detail || `HTTP ${response.status}`);
                error.httpStatus = response.status;
                if (activeMeetingJob && [400, 404, 410, 413, 422, 503].includes(response.status)) activeMeetingJob.unavailable = true;
                throw error;
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let completed = false;

            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        let data;
                        try { data = JSON.parse(line.slice(6)); }
                        catch (_) { const error = new Error('转写事件格式异常'); error.protocol = true; throw error; }
                        if (activeMeetingJob) {
                            if (!Number.isInteger(data.eventId) || data.eventId !== meetingEventCursor + 1
                                || (data.jobId && data.jobId !== activeMeetingJob.jobId)) {
                                const error = new Error('转写事件游标不连续，未确认完整结果');
                                error.protocol = true;
                                throw error;
                            }
                        }

                        if (data.type === 'status') {
                            if (data.jobId) document.getElementById('btnCancelMeeting').style.display = '';
                            uploadStatus.innerHTML = `
                                <div class="loading">
                                    <div class="spinner"></div>
                                    <span>${escapeHtml(data.message)}</span>
                                </div>
                            `;
                        } else if (data.type === 'info') {
                            uploadStatus.innerHTML = `
                                <div class="loading">
                                    <div class="spinner"></div>
                                    <span>正在处理，共 ${escapeHtml(data.total_segments)} 个片段（${escapeHtml(data.method)}）...</span>
                                </div>
                            `;
                        } else if (data.type === 'segment') {
                            if (typeof data.index === 'number' && data.index !== meetingTranscriptItems.length) {
                                throw new Error('复核片段序号不连续，请保留原始录音后重试');
                            }
                            const div = document.createElement('div');
                            div.className = 'transcript-item';
                            div.innerHTML = `
                                <div class="meta">
                                    <span class="time">[${escapeHtml(data.time)}]</span>
                                    <span class="speaker">${escapeHtml(data.speaker)}</span>
                                    <span class="confidence">(${escapeHtml(formatMeetingIdentity(data))})</span>
                                </div>
                                <div class="text">${escapeHtml(data.text)}</div>
                            `;
                            transcriptDiv.appendChild(div);
                            transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
                            meetingTranscriptItems.push(data);

                            uploadStatus.innerHTML = `
                                <div class="loading">
                                    <div class="spinner"></div>
                                    <span>正在转写，已显示 ${meetingTranscriptItems.length} 段...</span>
                                </div>
                            `;
                        } else if (data.type === 'done') {
                            if (data.segments !== meetingTranscriptItems.length) {
                                throw new Error('复核片段数量不完整，请保留原始录音后重试');
                            }
                            completed = true;
                            if (activeMeetingJob) activeMeetingJob.terminal = true;
                            document.getElementById('btnCancelMeeting').style.display = 'none';
                            document.getElementById('btnResumeMeeting').style.display = 'none';
                            uploadStatus.style.display = 'none';
                            generateMeetingMarkdown(sourceLabel);
                            document.getElementById('btnUploadSummary').disabled = false;
                            document.getElementById('btnDownloadMeeting').disabled = false;
                        } else if (data.type === 'error') {
                            if (activeMeetingJob) activeMeetingJob.terminal = true;
                            const error = new Error(data.message || '转录失败');
                            error.terminal = true;
                            throw error;
                        }
                        if (activeMeetingJob) meetingEventCursor = data.eventId;
                    }
                    if (completed) return;
                }
                if (!completed) throw new Error('连接中断，未收到完成确认；后台任务可能仍在继续，请恢复连接');
            } finally {
                await reader.cancel().catch(() => {});
                reader.releaseLock();
            }
        }

        async function transcribeLiveRecording(fileId, apiUrl = getApiUrl(), participants = getSelectedParticipants('live')) {
            if (!fileId) return;
            if (meetingJobBusy()) {
                alert('已有后台转写，请先恢复连接或取消该任务');
                return;
            }
            meetingRequestInProgress = true;
            switchTab('upload');

            try {
                resetMeetingResultUi();
                const shortId = fileId.slice(0, 8);
                document.getElementById('uploadStatus').innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <span>正在转录录音 ${shortId}...</span>
                    </div>
                `;

                // 使用录音当时的服务器和候选集合，不能将旧 fileId 发到后来切换的后端。
                const jobId = rememberMeetingJob(apiUrl, `录音 ${fileId}.wav`);
                const params = new URLSearchParams({ job_id: jobId });
                participants.forEach(id => {
                    params.append('allowed_speaker_ids', id);
                });
                const qs = params.toString();
                const url = `${apiUrl}/v1/meeting/recordings/${encodeURIComponent(fileId)}/transcribe/stream${qs ? '?' + qs : ''}`;

                const response = await fetch(url, { method: 'POST' });
                if (response.status === 404) {
                    throw new Error('录音文件不存在或已被清理');
                }
                await followMeetingJob(response);
            } catch (error) {
                showMeetingFailure(error);
            } finally {
                meetingRequestInProgress = false;
            }
        }

        function generateMeetingMarkdown(filename) {
            const now = new Date();
            const dateStr = now.toISOString().slice(0, 16).replace('T', ' ');

            let md = `# 会议复核稿\n\n> 自动转写，医学数字、术语与身份归属需人工核对。\n\n`;
            md += `- **日期**: ${dateStr}\n`;
            md += `- **音频文件**: ${filename}\n`;
            md += `---\n\n## 会议内容\n`;

            let currentSpeaker = null;
            for (const item of meetingTranscriptItems) {
                if (item.speaker !== currentSpeaker) {
                    md += `\n**[${item.time}] ${item.speaker}**:\n`;
                    currentSpeaker = item.speaker;
                }
                md += `> ${item.text}\n`;
            }

            meetingMarkdown = md;
        }

        function downloadMarkdown() {
            const blob = new Blob([meetingMarkdown], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `meeting_${new Date().toISOString().slice(0, 10)}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function renderSpeakerList() {
            const listDiv = document.getElementById('speakerList');
            if (!listDiv) {
                return;
            }

            if (registeredSpeakers.length > 0) {
                listDiv.replaceChildren();
                registeredSpeakers.forEach(speaker => {
                    const item = document.createElement('div');
                    item.className = 'speaker-item';

                    const meta = document.createElement('span');
                    meta.className = 'speaker-meta';

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'name';
                    nameSpan.textContent = `👤 ${speaker.name}`;

                    const idSpan = document.createElement('span');
                    idSpan.className = 'speaker-id';
                    idSpan.textContent = `ID: ${speaker.id}`;
                    idSpan.title = speaker.id;

                    const deleteBtn = document.createElement('button');
                    deleteBtn.type = 'button';
                    deleteBtn.className = 'btn-delete';
                    deleteBtn.textContent = '删除';
                    deleteBtn.onclick = () => deleteVoiceprint(speaker.id, speaker.name);

                    meta.appendChild(nameSpan);
                    meta.appendChild(idSpan);
                    item.appendChild(meta);
                    item.appendChild(deleteBtn);
                    listDiv.appendChild(item);
                });
            } else if (!getApiUrl()) {

            } else if (voiceprintLoadError) {
                listDiv.innerHTML = '<div class="empty-state">无法连接当前服务器</div>';
            } else if (voiceprintSourceUrl !== getApiUrl()) {
                listDiv.innerHTML = '<div class="empty-state">服务器地址已变更，正在等待刷新声纹列表</div>';
            } else {
                listDiv.innerHTML = '<div class="empty-state">暂无注册声纹</div>';
            }
        }

        async function loadVoiceprints() {
            const apiUrl = getApiUrl();
            if (!apiUrl) {
                invalidateVoiceprintCache();
                renderSpeakerList();
                return [];
            }

            if (voiceprintLoadPromise && voiceprintSourceUrl === apiUrl) {
                return voiceprintLoadPromise;
            }

            const loadToken = ++voiceprintLoadToken;
            voiceprintSourceUrl = apiUrl;

            voiceprintLoadPromise = (async () => {
                try {
                    voiceprintLoadError = '';
                    const response = await fetch(`${apiUrl}/v1/voiceprint/list`);
                    const result = await response.json();
                    if (loadToken !== voiceprintLoadToken || voiceprintSourceUrl !== apiUrl) {
                        return registeredSpeakers;
                    }
                    registeredSpeakers = normalizeVoiceprintSpeakers(result.speakers);
                    renderParticipantSelectors();
                    renderSpeakerList();
                    return registeredSpeakers;
                } catch (error) {
                    if (loadToken === voiceprintLoadToken && voiceprintSourceUrl === apiUrl) {
                        registeredSpeakers = [];
                        voiceprintLoadError = 'load_failed';
                        renderParticipantSelectors();
                        document.getElementById('speakerList').innerHTML =
                            '<div class="empty-state">无法连接服务器</div>';
                    }
                    throw error;
                } finally {
                    if (loadToken === voiceprintLoadToken) {
                        voiceprintLoadPromise = null;
                    }
                }
            })();

            return voiceprintLoadPromise;
        }

        async function registerVoiceprint() {
            const name = document.getElementById('speakerName').value.trim();
            const fileInput = document.getElementById('voiceprintFile');
            const file = fileInput.files[0];

            if (!name) { alert('请输入说话人姓名'); return; }
            if (!file) { alert('请选择音频文件'); return; }

            const formData = new FormData();
            formData.append('name', name);
            formData.append('file', file);

            try {
                const response = await fetch(`${getApiUrl()}/v1/voiceprint/register`, {
                    method: 'POST',
                    headers: adminHeaders(),
                    body: formData
                });

                const result = await response.json();

                if (result.status === 'success') {
                    alert(`✅ ${result.message}`);
                    document.getElementById('speakerName').value = '';
                    fileInput.value = '';
                    document.getElementById('voiceprintFileName').textContent = '选择音频文件';
                    loadVoiceprints();
                } else {
                    alert('注册失败: ' + adminErrorText(response, result));

                alert('请求失败: ' + error.message);
            }

            try {

        // ========== 会议总结 ==========

        async function requestSummary(source) {
            const btnId = source === 'live' ? 'btnLiveSummary' : 'btnUploadSummary';
            const sectionId = source === 'live' ? 'liveSummarySection' : 'uploadSummarySection';
            const boxId = source === 'live' ? 'liveSummaryBox' : 'uploadSummaryBox';
            const items = source === 'live' ? liveTranscriptItems : meetingTranscriptItems;

            const btn = document.getElementById(btnId);
            const section = document.getElementById(sectionId);
            const box = document.getElementById(boxId);

            if (!items || items.length === 0) {
                alert('没有转写内容可以总结');
                return;
            }

            const summaryApiUrl = getApiUrl();
            if (!confirm(`请确认已核对医学数字、单位、否定词与身份。\n将向 ${summaryApiUrl} 发送当前转写；若该服务器配置了外部 LLM，文本也会发送给该服务。是否继续？`)) return;

            // 显示 loading
            btn.disabled = true;
            btn.textContent = '⏳ 正在生成总结...';
            section.style.display = 'block';
            box.innerHTML = '<div class="summary-loading"><div class="spinner"></div><span>正在调用 AI 生成会议总结，请稍候...</span></div>';

            try {
                const response = await fetch(`${summaryApiUrl}/v1/meeting/summarize`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transcript: items })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    renderSummary(box, result.summary);
                    btn.textContent = '📋 重新生成总结';
                    btn.disabled = false;
                } else {
                    box.innerHTML = `<div style="color: #ff4757;">❌ ${escapeHtml(result.message || '生成失败')}</div>`;
                    btn.textContent = '📋 重试总结';
                    btn.disabled = false;
                }
            } catch (error) {
                box.innerHTML = `<div style="color: #ff4757;">❌ 请求失败: ${escapeHtml(error.message)}</div>`;
                btn.textContent = '📋 重试总结';
                btn.disabled = false;
            }
        }

        function renderSummary(container, markdownText) {
            // 简易 Markdown 渲染 (无需额外依赖)
            let html = escapeHtml(markdownText)
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/^- (.+)$/gm, '<li>$1</li>')
                .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
                .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
                .replace(/\n\n/g, '<br><br>')
                .replace(/\n/g, '<br>');

            // 把连续的 <li> 包裹在 <ul> 中
            html = html.replace(/(<li>.*?<\/li>(?:<br>)?)+/gs, (match) => {
                return '<ul>' + match.replace(/<br>/g, '') + '</ul>';
            });

            container.innerHTML = html;
        }

        document.addEventListener('click', (event) => {
            if (!event.target.closest('.participant-multiselect')) {
                closeAllParticipantDropdowns();
            }
        });

        serverUrlInput.addEventListener('input', () => {
            if (voiceprintSourceUrl && voiceprintSourceUrl !== getApiUrl()) {
                invalidateVoiceprintCache();
                renderSpeakerList();
            }
        });

        async function refreshVoiceprintsForCurrentServer() {
            const apiUrl = getApiUrl();
            if (!apiUrl) {
                invalidateVoiceprintCache();
                renderSpeakerList();
                return;
            }
            if (voiceprintSourceUrl !== apiUrl) {
                invalidateVoiceprintCache();
            }
            try {
                await loadVoiceprints();
            } catch (error) {
                console.warn('刷新当前服务器声纹列表失败:', error);
            }
        }

        serverUrlInput.addEventListener('change', () => {
            refreshVoiceprintsForCurrentServer();
        });

        serverUrlInput.addEventListener('blur', () => {
            refreshVoiceprintsForCurrentServer();
        });

        // ========== KWS 关键词维护 ==========
        // 草稿只在本页内存；保存时整表 PUT 并带上读取时的 version，服务端已被别人改过则拒绝。
        const KWS_DIGITS = '零一二三四五六七八九';
        const KWS_COLLAPSE_AT = 24;
        const KWS_SEPARATORS = /[,，、;；\s]+/;
        const KWS_CODE_PATTERN = /^[a-z][a-z0-9_]{0,31}$/;
        let kwsSaved = null;  // 服务端生效的关键词表，用来对比草稿改动
        let kwsSavedPhrases = new Set();
        let kwsState = null;  // 编辑中的草稿
        let kwsMeta = null;
        let kwsLoadError = '';
        let kwsNextId = 1;
        let kwsUndo = null;
        let kwsToastTimer = null;
        const kwsUi = { drafts: {}, hints: {}, expanded: {}, selected: null, armed: null, batchOpen: null, focus: null, saveError: '', saving: false };

        function kwsToChinese(n) {
            if (n < 10) return KWS_DIGITS[n];
            if (n < 20) return '十' + (n % 10 ? KWS_DIGITS[n % 10] : '');
            if (n < 100) return KWS_DIGITS[Math.floor(n / 10)] + '十' + (n % 10 ? KWS_DIGITS[n % 10] : '');
            const rest = n % 100;
            const tail = rest === 0 ? '' : rest < 10 ? '零' + KWS_DIGITS[rest] : rest < 20 ? '一' + kwsToChinese(rest) : kwsToChinese(rest);
            return KWS_DIGITS[Math.floor(n / 100)] + '百' + tail;
        }

        function kwsParseChinese(run) {
            let total = 0, current = 0;
            for (const ch of run) {
                const digit = KWS_DIGITS.indexOf(ch);
                if (digit >= 0) current = digit;
                else if (ch === '十') { total += (current || 1) * 10; current = 0; }
                else if (ch === '百') { total += current * 100; current = 0; }
            }
            return total + current;
        }

        // 模型只认说出口的汉字发音：12床 说成 十二床。超过 999 的数字原样保留，由服务端报无法识别。
        function kwsSpeak(text) {
            return text.replace(/\d+/g, m => Number(m) <= 999 ? kwsToChinese(Number(m)) : m);
        }

        function kwsDefaultValue(piece, phrase, isSlot) {
            if (!isSlot) return phrase;
            return /\d/.test(piece) ? piece : phrase.replace(/[零一二三四五六七八九十百]+/g, run => String(kwsParseChinese(run)));
        }

        function kwsTag(keyword) {
            return {
                id: kwsNextId++,
                phrase: keyword.phrase,
                value: keyword.value || keyword.phrase,
                boost: keyword.boost == null ? '' : String(keyword.boost),
                threshold: keyword.threshold == null ? '' : String(keyword.threshold),
                tokens: keyword.tokens || '',
                error: '',
                serverError: '',
                pending: !!keyword.pending,
            };
        }

        function kwsClone(value) {
            return JSON.parse(JSON.stringify(value));
        }

        function kwsCategory(code) {
            return kwsState.categories.find(c => c.code === code);
        }

        function kwsFindTag(id) {
            for (const cat of kwsState.categories) {
                const tag = cat.keywords.find(t => t.id === id);
                if (tag) return { cat, tag };
            }
            return null;
        }

        function kwsFindPhrase(phrase) {
            for (const cat of kwsState.categories) {
                const tag = cat.keywords.find(t => t.phrase === phrase);
                if (tag) return { cat, tag };
            }
            return null;
        }

        function kwsKeywordMap(doc) {
            return new Map(doc.categories.flatMap(c => c.keywords.map(k => [k.phrase, JSON.stringify([c.code, k.value, k.boost, k.threshold])])));
        }

        function kwsChangeCount() {
            if (!kwsState) return 0;
            const before = kwsKeywordMap(kwsSaved);
            const after = kwsKeywordMap(kwsState);
            let count = 0;
            for (const [phrase, info] of after) if (before.get(phrase) !== info) count++;
            for (const phrase of before.keys()) if (!after.has(phrase)) count++;
            const savedCats = new Map(kwsSaved.categories.map(c => [c.code, c]));
            for (const cat of kwsState.categories) {
                const old = savedCats.get(cat.code);
                if (!old || old.name !== cat.name || old.slot !== cat.slot) count++;
            }
            for (const code of savedCats.keys()) if (!kwsCategory(code)) count++;
            return count;
        }

        function kwsTagStatus(tag) {
            if (tag.error || tag.serverError) return 'invalid';
            if (tag.pending) return 'pending';
            return kwsSavedPhrases.has(tag.phrase) ? 'saved' : 'new';
        }

        function kwsErrorText(result) {
            return typeof result?.detail === 'string' ? result.detail : JSON.stringify(result?.detail ?? result);
        }

        function kwsApply(result) {
            const categories = result.categories.map(c => ({ code: c.code, name: c.name, slot: c.slot, keywords: c.keywords.map(kwsTag) }));
            kwsSaved = { categories };
            kwsSavedPhrases = new Set(categories.flatMap(c => c.keywords.map(k => k.phrase)));
            kwsState = kwsClone(kwsSaved);
            kwsMeta = { version: result.version, updatedAt: result.updated_at, activeSessions: result.active_sessions };
            Object.assign(kwsUi, { drafts: {}, hints: {}, selected: null, armed: null, batchOpen: null, saveError: '' });
            kwsUndo = null;
            kwsLoadError = '';
        }

        async function loadKwsKeywords(force = false) {
            // 切回本页时保留未保存的草稿。
            if (!force && kwsState && kwsChangeCount()) {
                kwsRender();
                return;
            }
            try {
                const response = await fetch(`${getApiUrl()}/v1/kws/keywords`);
                const result = await response.json();
                if (!response.ok) throw new Error(kwsErrorText(result));
                if (result.enabled) {
                    kwsApply(result);
                } else {
                    kwsState = kwsSaved = kwsMeta = null;
                    kwsLoadError = '服务端未启用 KWS（KWS_ENABLED=0），没有可维护的关键词。';
                }
            } catch (error) {
                kwsState = kwsSaved = kwsMeta = null;
                kwsLoadError = `无法加载关键词：${error.message}`;
            }
            kwsRender();
        }

        async function kwsPreview(tags) {
            for (let i = 0; i < tags.length; i += 200) {
                const chunk = tags.slice(i, i + 200);
                try {
                    const response = await fetch(`${getApiUrl()}/v1/kws/keywords/preview`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phrases: chunk.map(t => t.phrase) }),
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(kwsErrorText(result));
                    chunk.forEach((tag, index) => {
                        const item = result.items[index];
                        // 请求期间说法被改过的，以后一次预览为准。
                        if (!item || item.phrase !== tag.phrase) return;
                        tag.tokens = item.tokens;
                        tag.error = item.error || '';
                        tag.pending = false;
                    });
                } catch (error) {
                    chunk.forEach(tag => { tag.pending = false; });
                    kwsUi.saveError = `发音预览失败：${error.message}`;
                }
            }
            kwsRender();
        }

        function kwsAddPhrases(code, raw) {
            const cat = kwsCategory(code);
            const dupes = [], added = [];
            let last = null;
            for (const piece of raw.split(KWS_SEPARATORS).map(s => s.trim()).filter(Boolean)) {
                const phrase = kwsSpeak(piece);
                const hit = kwsFindPhrase(phrase);
                if (hit) {
                    dupes.push(`「${phrase}」已在${hit.cat.name}里`);
                    last = hit.tag.id;
                    continue;
                }
                const tag = kwsTag({ phrase, value: kwsDefaultValue(piece, phrase, cat.slot), pending: true });
                cat.keywords.push(tag);
                added.push(tag);
            }
            kwsUi.hints[code] = dupes.join('；');
            kwsUi.saveError = '';
            kwsRender();
            if (last !== null) kwsFlash(last);
            if (added.length) kwsPreview(added);
            return added;
        }

        function kwsRemoveTag(id) {
            const { cat, tag } = kwsFindTag(id);
            const index = cat.keywords.indexOf(tag);
            cat.keywords.splice(index, 1);
            if (kwsUi.selected === id) kwsUi.selected = null;
            kwsUi.armed = null;
            kwsUndo = () => { cat.keywords.splice(index, 0, tag); };
            kwsShowToast(`已删除「${tag.phrase}」`, true);
            kwsRender();
        }

        function kwsRemoveCategory(code) {
            const index = kwsState.categories.findIndex(c => c.code === code);
            const [cat] = kwsState.categories.splice(index, 1);
            kwsUndo = () => { kwsState.categories.splice(index, 0, cat); };
            kwsShowToast(`已删除类别「${cat.name}」及 ${cat.keywords.length} 个关键词`, true);
            kwsRender();
        }

        function kwsUndoLast() {
            if (kwsUndo) kwsUndo();
            kwsUndo = null;
            document.getElementById('kwsToast').hidden = true;
            kwsRender();
        }

        function kwsShowToast(text, withUndo) {
            document.getElementById('kwsToastText').textContent = text;
            document.getElementById('kwsToastUndo').hidden = !withUndo;
            document.getElementById('kwsToast').hidden = false;
            clearTimeout(kwsToastTimer);
            kwsToastTimer = setTimeout(() => {
                document.getElementById('kwsToast').hidden = true;
                kwsUndo = null;
            }, 5000);
        }

        function kwsFlash(id) {
            const tag = document.querySelector(`[data-kws-tag="${id}"]`);
            if (!tag) return;
            tag.classList.remove('flash');
            void tag.offsetWidth;
            tag.classList.add('flash');
            tag.scrollIntoView?.({ block: 'nearest' });
        }

        function kwsSelectTag(event, id) {
            event?.stopPropagation();
            kwsUi.selected = kwsUi.selected === id ? null : id;
            kwsUi.armed = null;
            kwsRender();
        }

        function kwsTagKey(event, id) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                kwsSelectTag(event, id);
            } else if (event.key === 'Delete' || event.key === 'Backspace') {
                event.preventDefault();
                kwsUi.focus = kwsFindTag(id).cat.code;
                kwsRemoveTag(id);
            }
        }

        function kwsFocusInput(code) {
            document.getElementById(`kws-in-${code}`).focus();
        }

        function kwsDraftInput(code, value) {
            kwsUi.drafts[code] = value;
            if (kwsUi.armed) {
                kwsUi.armed = null;
                kwsUi.focus = code;
                kwsRender();
            }
        }

        function kwsInputKey(event, code) {
            if (event.isComposing) return;
            const input = event.target;
            const cat = kwsCategory(code);
            if (event.key === 'Enter') {
                event.preventDefault();
                const raw = input.value;
                kwsUi.drafts[code] = '';
                kwsUi.focus = code;
                if (raw.trim()) kwsAddPhrases(code, raw);
                else kwsRender();
            } else if (event.key === 'Backspace' && !input.value && cat.keywords.length) {
                // 空输入时第一次 Backspace 选中最后一个标签，第二次删除。
                const last = cat.keywords[cat.keywords.length - 1];
                kwsUi.focus = code;
                if (kwsUi.armed === last.id) {
                    kwsRemoveTag(last.id);
                } else {
                    kwsUi.armed = last.id;
                    kwsUi.expanded[code] = true;
                    kwsRender();
                }
            } else if (event.key === 'Escape') {
                kwsUi.drafts[code] = '';
                kwsUi.armed = null;
                kwsUi.focus = code;
                kwsRender();
            }
        }

        function kwsPaste(event, code) {
            const text = event.clipboardData.getData('text');
            if (!KWS_SEPARATORS.test(text.trim())) return;
            event.preventDefault();
            const raw = (kwsUi.drafts[code] || '') + text;
            kwsUi.drafts[code] = '';
            kwsUi.focus = code;
            kwsAddPhrases(code, raw);
        }

        function kwsEditPhrase(id, raw) {
            const { cat, tag } = kwsFindTag(id);
            const phrase = kwsSpeak(raw.split(KWS_SEPARATORS).join(''));
            const hit = kwsFindPhrase(phrase);
            if (hit && hit.tag !== tag) {
                kwsUi.hints[cat.code] = `「${phrase}」已在${hit.cat.name}里`;
                kwsRender();
                kwsFlash(hit.tag.id);
                return;
            }
            if (phrase && phrase !== tag.phrase) {
                Object.assign(tag, { phrase, tokens: '', error: '', serverError: '', pending: true });
                kwsRender();
                kwsPreview([tag]);
            } else {
                kwsRender();
            }
        }

        function kwsEditField(id, key, value) {
            const { tag } = kwsFindTag(id);
            tag[key] = value.trim();
            tag.serverError = '';
            kwsRenderSave();
        }

        function kwsSetSlot(code, slot) {
            kwsCategory(code).slot = slot;
            kwsRender();
        }

        function kwsRenameCategory(code, value) {
            const cat = kwsCategory(code);
            cat.name = value.trim().slice(0, 32) || cat.name;
            kwsRender();
        }

        function kwsExpand(code) {
            kwsUi.expanded[code] = true;
            kwsRender();
        }

        function kwsToggleBatch(code) {
            kwsUi.batchOpen = kwsUi.batchOpen === code ? null : code;
            kwsRender();
        }

        function kwsBatchItems(code) {
            const template = document.getElementById(`kws-bt-${code}`).value.trim();
            const from = Number(document.getElementById(`kws-bf-${code}`).value);
            const to = Math.min(Number(document.getElementById(`kws-bto-${code}`).value), 999);
            const items = [];
            if (!template.includes('{n}') || !Number.isInteger(from) || !Number.isInteger(to) || from < 0) return items;
            for (let n = from; n <= to && items.length < 500; n++) {
                items.push({ phrase: kwsSpeak(template.replaceAll('{n}', kwsToChinese(n))), value: template.replaceAll('{n}', String(n)) });
            }
            return items;
        }

        function kwsBatchRefresh(code) {
            const items = kwsBatchItems(code);
            const fresh = items.filter(x => !kwsFindPhrase(x.phrase));
            document.getElementById(`kws-bp-${code}`).textContent = items.length
                ? `将添加 ${fresh.length} 个（${items[0].phrase} … ${items[items.length - 1].phrase}），跳过已存在 ${items.length - fresh.length} 个`
                : '模板须含 {n}，范围为 0-999 的整数';
        }

        function kwsBatchAdd(code) {
            const cat = kwsCategory(code);
            const added = kwsBatchItems(code)
                .filter(x => !kwsFindPhrase(x.phrase))
                .map(x => kwsTag({ phrase: x.phrase, value: cat.slot ? x.value : x.phrase, pending: true }));
            cat.keywords.push(...added);
            kwsUi.batchOpen = null;
            kwsUi.expanded[code] = true;
            kwsRender();
            if (added.length) kwsPreview(added);
        }

        function kwsAddCategory() {
            const name = document.getElementById('kwsNewName').value.trim();
            const code = document.getElementById('kwsNewCode').value.trim();
            const hint = document.getElementById('kwsNewHint');
            if (!name) { hint.textContent = '填写类别名称'; return; }
            if (!KWS_CODE_PATTERN.test(code)) { hint.textContent = '类别代码只能用小写字母、数字和下划线，以字母开头，最多 32 个字符'; return; }
            if (kwsCategory(code)) { hint.textContent = `类别代码 ${code} 已存在`; return; }
            hint.textContent = '';
            kwsState.categories.push({ code, name: name.slice(0, 32), slot: document.getElementById('kwsNewType').value === 'slot', keywords: [] });
            document.getElementById('kwsNewName').value = '';
            document.getElementById('kwsNewCode').value = '';
            kwsUi.focus = code;
            kwsRender();
        }

        function kwsPayload() {
            return {
                version: kwsMeta.version,
                categories: kwsState.categories.map(c => ({
                    code: c.code, name: c.name, slot: c.slot,
                    keywords: c.keywords.map(k => ({ phrase: k.phrase, value: k.value, boost: k.boost, threshold: k.threshold })),
                })),
            };
        }

        async function saveKwsKeywords() {
            const bad = kwsState.categories.flatMap(c => c.keywords.filter(t => t.error).map(tag => ({ cat: c, tag })));
            if (bad.length) {
                kwsUi.saveError = `有 ${bad.length} 个关键词无法识别发音（${bad.map(x => x.tag.phrase).join('、')}），修正或删除后再保存。`;
                kwsUi.selected = bad[0].tag.id;
                kwsUi.expanded[bad[0].cat.code] = true;
                kwsRender();
                kwsFlash(bad[0].tag.id);
                return;
            }
            kwsUi.saving = true;
            kwsUi.saveError = '';
            kwsRenderSave();
            try {
                const response = await fetch(`${getApiUrl()}/v1/kws/keywords`, {
                    method: 'PUT',
                    headers: adminHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify(kwsPayload()),
                });
                const result = await response.json();
                if (!response.ok) {
                    for (const item of result.errors || []) {
                        const hit = item.phrase && kwsFindPhrase(item.phrase);
                        if (hit) hit.tag.serverError = item.message;
                    }
                    throw new Error(response.status === 401 ? adminErrorText(response, result) : kwsErrorText(result));
                }
                kwsApply(result);
                kwsShowToast(`已保存为 v${result.version}，新开始的实时会话使用这份关键词`, false);
            } catch (error) {
                kwsUi.saveError = `保存失败：${error.message}`;
            } finally {
                kwsUi.saving = false;
                kwsRender();
            }
        }

        async function discardKwsChanges() {
            await loadKwsKeywords(true);
            if (kwsState) kwsShowToast('已放弃未保存的改动，并重新读取服务端关键词', false);
        }

        function kwsRenderTag(tag) {
            const status = kwsTagStatus(tag);
            const classes = ['kws-tag', status, kwsUi.selected === tag.id ? 'selected' : '', kwsUi.armed === tag.id ? 'armed' : ''].join(' ');
            const value = tag.value && tag.value !== tag.phrase ? `<span class="kws-val">→ ${escapeHtml(tag.value)}</span>` : '';
            const title = tag.error || tag.serverError || `说法：${tag.phrase}\n命中值：${tag.value}\n点击编辑`;
            return `<span class="${classes}" data-kws-tag="${tag.id}" tabindex="0" role="button" title="${escapeHtml(title)}"
                onclick="kwsSelectTag(event, ${tag.id})" onkeydown="kwsTagKey(event, ${tag.id})">${escapeHtml(tag.phrase)}${value}<button
                class="kws-x" type="button" aria-label="删除 ${escapeHtml(tag.phrase)}" onclick="event.stopPropagation(); kwsRemoveTag(${tag.id})">×</button></span>`;
        }

        function kwsRenderEditor(cat, tag) {
            const id = tag.id;
            const problem = tag.error || tag.serverError;
            const tokens = problem
                ? `<div class="kws-tokens bad">${escapeHtml(problem)}</div>`
                : `<div class="kws-tokens">${escapeHtml(tag.pending ? '生成中...' : tag.tokens)}</div>`;
            const field = (key, label, hint) => `<div class="kws-field"><label for="kws-${key}-${id}">${label}</label>
                <input id="kws-${key}-${id}" value="${escapeHtml(tag[key])}" placeholder="默认" inputmode="decimal" autocomplete="off"
                    oninput="kwsEditField(${id}, '${key}', this.value)"><small>${hint}</small></div>`;
            return `<div class="kws-panel" aria-label="编辑关键词">
                <div class="kws-panel-title">编辑「${escapeHtml(tag.phrase)}」</div>
                <div class="kws-field"><label for="kws-phrase-${id}">说法</label>
                    <input id="kws-phrase-${id}" value="${escapeHtml(tag.phrase)}" autocomplete="off" onchange="kwsEditPhrase(${id}, this.value)">
                    <small>实际要说出口的词</small></div>
                <div class="kws-field"><label for="kws-value-${id}">命中值</label>
                    <input id="kws-value-${id}" value="${escapeHtml(tag.value)}" autocomplete="off" oninput="kwsEditField(${id}, 'value', this.value)">
                    <small>${cat.slot ? `写进转写的 context.${cat.code}` : '随 kws.detected 推给业务端'}，不能含空格</small></div>
                <div class="kws-field"><label>发音</label>${tokens}</div>
                ${field('boost', '增益', '调大更容易命中，常用 1.0-2.0')}
                ${field('threshold', '阈值', '调小更容易命中，误触发也会变多')}
                <div class="kws-panel-actions">
                    <button class="kws-chip danger" type="button" onclick="kwsRemoveTag(${id})">删除</button>
                    <button class="kws-chip" type="button" onclick="kwsSelectTag(event, ${id})">收起</button>
                </div>
            </div>`;
        }

        function kwsRenderBatch(code) {
            const input = (key, label, value, extra = '') => `<div class="kws-field"><label for="kws-${key}-${code}">${label}</label>
                <input id="kws-${key}-${code}" value="${value}" autocomplete="off" oninput="kwsBatchRefresh('${code}')">${extra}</div>`;
            return `<div class="kws-panel" aria-label="按编号批量生成">
                <div class="kws-panel-title">按编号批量生成</div>
                ${input('bt', '模板', '{n}床', '<small>{n} 处说成中文数字，命中值用阿拉伯数字</small>')}
                ${input('bf', '从', '1')}
                ${input('bto', '到', '10')}
                <div class="kws-panel-actions"><small id="kws-bp-${code}"></small>
                    <button class="kws-chip" type="button" onclick="kwsToggleBatch('${code}')">取消</button>
                    <button class="kws-chip" type="button" onclick="kwsBatchAdd('${code}')">添加</button>
                </div>
            </div>`;
        }

        function kwsRenderCategory(cat) {
            const code = cat.code;
            const expanded = kwsUi.expanded[code] || cat.keywords.length <= KWS_COLLAPSE_AT;
            const visible = expanded ? cat.keywords : cat.keywords.slice(0, KWS_COLLAPSE_AT);
            const isSaved = kwsSaved.categories.some(c => c.code === code);
            const selected = cat.keywords.find(t => t.id === kwsUi.selected);
            const hint = kwsUi.hints[code] || (cat.slot
                ? `命中后当前 ${code} 切换为该值，并标到之后的转写片段上`
                : '命中时推送 kws.detected，服务端不改变上下文');
            return `<section class="kws-cat" aria-label="${escapeHtml(cat.name)}">
                <div class="kws-cat-head">
                    <input class="kws-cat-name" id="kws-name-${code}" value="${escapeHtml(cat.name)}" aria-label="类别名称" title="点击改名"
                        onchange="kwsRenameCategory('${code}', this.value)">
                    <span class="kws-code">${code}</span>
                    <span class="kws-seg" role="group" aria-label="类型">
                        <button type="button" aria-pressed="${cat.slot}" onclick="kwsSetSlot('${code}', true)">上下文槽位</button>
                        <button type="button" aria-pressed="${!cat.slot}" onclick="kwsSetSlot('${code}', false)">只推事件</button>
                    </span>
                    <span class="kws-count">${cat.keywords.length} 个</span>
                    <span class="kws-spacer"></span>
                    <button class="kws-chip" type="button" onclick="kwsToggleBatch('${code}')">按编号批量生成</button>
                    <button class="kws-chip danger" type="button" onclick="kwsRemoveCategory('${code}')">${isSaved ? '删除类别' : '移除'}</button>
                </div>
                <div class="kws-tagbox" onclick="kwsFocusInput('${code}')">
                    ${visible.map(kwsRenderTag).join('')}
                    ${expanded ? '' : `<button class="kws-more" type="button" onclick="event.stopPropagation(); kwsExpand('${code}')">展开其余 ${cat.keywords.length - KWS_COLLAPSE_AT} 个</button>`}
                    <input class="kws-input" id="kws-in-${code}" aria-label="${escapeHtml(cat.name)} 新关键词" autocomplete="off"
                        placeholder="${cat.keywords.length ? '输入关键词，回车添加' : '输入第一个关键词，回车添加'}"
                        value="${escapeHtml(kwsUi.drafts[code] || '')}"
                        oninput="kwsDraftInput('${code}', this.value)" onkeydown="kwsInputKey(event, '${code}')" onpaste="kwsPaste(event, '${code}')">
                </div>
                <div class="kws-hint${kwsUi.hints[code] ? ' warn' : ''}">${escapeHtml(hint)}</div>
                ${kwsUi.batchOpen === code ? kwsRenderBatch(code) : ''}
                ${selected ? kwsRenderEditor(cat, selected) : ''}
            </section>`;
        }

        function kwsRenderSave() {
            const pill = document.getElementById('kwsStatePill');
            const meta = document.getElementById('kwsSummaryMeta');
            const text = document.getElementById('kwsSaveText');
            document.getElementById('kwsSaveBar').hidden = !kwsState;
            document.getElementById('kwsNewCategory').hidden = !kwsState;
            if (!kwsState) {
                pill.className = 'kws-pill';
                pill.textContent = kwsLoadError ? '不可用' : '未加载';
                meta.textContent = '';
                return;
            }
            const changes = kwsChangeCount();
            const invalid = kwsState.categories.flatMap(c => c.keywords).filter(t => t.error).length;
            const total = kwsSaved.categories.reduce((n, c) => n + c.keywords.length, 0);
            const savedAt = kwsMeta.updatedAt
                ? `${kwsMeta.updatedAt.replace('T', ' ').slice(0, 16)} 保存`
                : '从 KWS_KEYWORDS_FILE 导入，尚未在本页保存';
            meta.textContent = `线上 v${kwsMeta.version} · ${savedAt} · ${kwsSaved.categories.length} 个类别 · ${total} 个关键词`;
            pill.className = changes ? 'kws-pill dirty' : 'kws-pill ok';
            pill.textContent = changes ? '有未保存改动' : '已生效';
            text.className = kwsUi.saveError ? 'kws-savebar-text err' : 'kws-savebar-text';
            const sessions = kwsMeta.activeSessions;
            if (kwsUi.saveError) {
                text.innerHTML = `<b>${escapeHtml(kwsUi.saveError)}</b>`;
            } else if (changes) {
                text.innerHTML = `<b>${changes} 处改动未保存</b>。保存后新开始的实时会话生效，进行中的 ${sessions} 个会话不受影响。`
                    + (invalid ? ` 另有 ${invalid} 个关键词无法识别发音。` : '');
            } else {
                text.textContent = `没有未保存的改动。服务端当前有 ${sessions} 个实时会话。`;
            }
            document.getElementById('kwsBtnSave').disabled = !changes || kwsUi.saving;
            document.getElementById('kwsBtnDiscard').disabled = !changes || kwsUi.saving;
            document.getElementById('kwsBtnSave').textContent = kwsUi.saving ? '保存中...' : '保存并生效';
        }

        function kwsRender() {
            const box = document.getElementById('kwsCategories');
            const focusId = kwsUi.focus ? `kws-in-${kwsUi.focus}` : document.activeElement?.id;
            kwsUi.focus = null;
            if (!kwsState) {
                box.innerHTML = `<div class="empty-state">${escapeHtml(kwsLoadError || '加载中...')}</div>`;
            } else {
                box.innerHTML = kwsState.categories.length
                    ? kwsState.categories.map(kwsRenderCategory).join('')
                    : '<div class="empty-state">还没有类别，先在下方新建</div>';
                if (kwsUi.batchOpen && kwsCategory(kwsUi.batchOpen)) kwsBatchRefresh(kwsUi.batchOpen);
            }
            kwsRenderSave();
            // 重绘后把焦点和光标放回原输入框，连续输入不被打断。
            const input = focusId && focusId.startsWith('kws-') ? document.getElementById(focusId) : null;
            if (input) {
                input.focus();
                input.setSelectionRange?.(input.value.length, input.value.length);
            }
        }

        // 页面加载时恢复最近任务；只订阅原服务器，不重新上传或重新推理。
        restoreMeetingJob();
        loadVoiceprints();
    </script>
</body>

</html>
